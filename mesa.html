<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:transparent;font:14px/1.3 Barlow,system-ui,sans-serif;color:#eef0ee;overflow:hidden}
#p{background:#161a1bee;border:1px solid #8b9594;box-shadow:0 6px 20px #000a;width:max-content;min-width:100%;box-sizing:border-box}
.hd{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;user-select:none}
.hd b{font:700 1rem "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.08em;flex:1}
.hd span{color:#9aa4a3;font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid #2b3233}
.row.gm{cursor:pointer}.row.gm:hover{background:#232a2b}
.av{width:44px;height:44px;flex:none;background:#1d2223 center/cover no-repeat;border:1px solid #3a4344}
.in{flex:1;min-width:0}
.nm{font:700 1rem "Barlow Condensed",sans-serif;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center;font-size:.8rem;color:#9aa4a3;margin-top:3px}
.st i{display:block;height:6px;background:#2b3233}.st u{display:block;height:100%}
.pv u{background:#e0524f}.pd u{background:#4f9fe0}
.st em{font-style:normal;color:#eef0ee;min-width:38px;text-align:right}
.ft{padding:8px 10px;border-top:1px solid #2b3233;display:flex;gap:8px;align-items:center;justify-content:space-between;color:#9aa4a3;font-size:.85rem}
button{font:600 .9rem Barlow,sans-serif;color:#eef0ee;background:transparent;border:1px solid #8b9594;padding:5px 12px;cursor:pointer}
button:hover{background:#232a2b}
.empty{padding:10px;color:#9aa4a3}
</style>
</head>
<body>
<div id="p"></div>
<script type="module">
import {loadOBR,ready} from "./obr.js";
import {KEY,LS,store} from "./mesa-lib.js";
const qs=new URLSearchParams(location.search),pid=qs.get("pid")||"ordem.mesa/panel",P=document.getElementById("p");
const abs=p=>new URL(p,location.href).href;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let OBR=null,self=null,party=[],role="PLAYER",collapsed=store.get(LS.collapsed)==="1";

function stat(cls,l,cur,max){
  const r=el("div","st "+cls);r.append(el("span",null,l));
  const b=el("i"),u=el("u");u.style.width=(max>0?Math.max(0,Math.min(100,cur/max*100)):0)+"%";b.append(u);
  r.append(b,el("em",null,cur+"/"+max));return r;
}
function row(p){
  const e=p.metadata[KEY],r=el("div","row"+(role==="GM"?" gm":""));
  const av=el("div","av");if(e.th)av.style.backgroundImage="url("+e.th+")";
  const i=el("div","in"),n=el("div","nm",e.nome||p.name||"Jogador");n.style.color=p.color||"#ecc962";
  i.append(n,stat("pv","PV",e.pv,e.pvmax),stat("pd","PD",e.pd,e.pdmax));
  r.append(av,i);
  if(role==="GM"){r.title="Abrir a ficha de "+(e.nome||p.name);r.onclick=()=>OBR.modal.open({
    id:"ordem.mesa/gm/"+p.id,url:abs("gm.html")+"?p="+encodeURIComponent(p.id)+"&m="+encodeURIComponent("ordem.mesa/gm/"+p.id),width:1120,height:820}).catch(()=>{})}
  return r;
}
function render(){
  const all=[self,...party].filter(p=>p&&p.metadata&&p.metadata[KEY]);
  const joined=store.get(LS.joined)==="1";
  P.replaceChildren();
  const hd=el("div","hd");hd.append(el("b",null,"Mesa"),el("span",null,all.length?all.length+" na mesa":""),el("span",null,collapsed?"▸":"▾"));
  hd.onclick=()=>{collapsed=!collapsed;store.set(LS.collapsed,collapsed?"1":"0");render()};
  P.append(hd);
  if(!collapsed){
    if(!all.length)P.append(el("div","empty",role==="GM"?"Ninguém entrou na mesa ainda.":"Ninguém entrou ainda."));
    all.forEach(p=>P.append(row(p)));
    if(role!=="GM"){
      const f=el("div","ft"),b=el("button",null,joined?"Sair da mesa":"Entrar na mesa");
      f.append(el("span",null,joined?"Os outros veem seu PV e PD.":"Mostre foto, PV e PD."),b);
      b.onclick=()=>{store.set(LS.joined,joined?"0":"1");OBR.broadcast.sendMessage("ordem.mesa/nudge",{},{destination:"LOCAL"}).catch(()=>{});render()};
      P.append(f);
    }
  }
  requestAnimationFrame(()=>{
    if(!OBR)return;
    OBR.popover.setWidth(pid,collapsed?150:Math.max(250,P.offsetWidth)).catch(()=>{});
    OBR.popover.setHeight(pid,P.offsetHeight+2).catch(()=>{});
  });
}
(async()=>{
  render();
  OBR=await loadOBR();
  if(!OBR||!(await ready(OBR)))return;
  const me=async()=>({id:OBR.player.id,name:await OBR.player.getName(),color:await OBR.player.getColor(),metadata:await OBR.player.getMetadata()});
  role=await OBR.player.getRole();self=await me();party=await OBR.party.getPlayers();render();
  OBR.player.onChange(p=>{self={id:p.id||self.id,name:p.name,color:p.color,metadata:p.metadata};role=p.role||role;render()});
  OBR.party.onChange(ps=>{party=ps;render()});
  addEventListener("storage",render);
})();
</script>
</body>
</html>
