<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha do jogador — visão do mestre</title>
<style>
html,body{margin:0;height:100%;background:#161a1b;color:#eef0ee;font:14px/1.3 Barlow,system-ui,sans-serif}
body{display:flex;flex-direction:column}
.bar{display:flex;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid #3a4344;color:#9aa4a3}
.bar b{color:#eef0ee;font-size:1rem}.bar .sp{flex:1}
#warn{color:#e9a23b}
iframe{flex:1;width:100%;border:0;background:#161a1b}
</style>
</head>
<body>
<div class="bar"><b id="who">Ficha</b><span>somente leitura · atualiza ao vivo</span><span id="warn"></span><span class="sp"></span></div>
<iframe id="f" title="Ficha do jogador"></iframe>
<script type="module">
import {loadOBR,ready} from "./obr.js";
import {KEY,unpack} from "./mesa-lib.js";
const qs=new URLSearchParams(location.search),pid=qs.get("p")||"";
const $=s=>document.querySelector(s),f=$("#f");
(async()=>{
  const OBR=await loadOBR();
  if(!OBR||!(await ready(OBR))){$("#warn").textContent="Abra pelo Owlbear Rodeo.";return}
  async function show(players){
    const p=players.find(x=>x.id===pid),e=p&&p.metadata&&p.metadata[KEY];
    if(!e){$("#warn").textContent="O jogador saiu da mesa.";return}
    $("#who").textContent=e.nome||p.name||"Jogador";
    let sheet=null;if(e.z){try{sheet=await unpack(e.z)}catch(err){}}
    $("#warn").textContent=sheet?"":"Ficha grande demais para enviar: mostrando só o resumo.";
    if(!sheet)sheet=JSON.stringify({nome:e.nome,perfil:e.perfil,nivel:e.nivel,pv:e.pv,pvmax:e.pvmax,pd:e.pd,pdmax:e.pdmax});
    window.__FICHA_VIEW={sheet,img:e.th||null};
    const w=f.contentWindow;
    if(!f.getAttribute("src"))f.src="ficha.html?view=1";
    else if(w&&w.__viewSet){w.__viewSet(sheet,e.th||null);if(w.fichaRecarregar)w.fichaRecarregar()}
  }
  const all=async()=>[{id:OBR.player.id,metadata:await OBR.player.getMetadata(),name:await OBR.player.getName()},...await OBR.party.getPlayers()];
  show(await all());
  OBR.party.onChange(async()=>show(await all()));
})();
</script>
</body>
</html>
