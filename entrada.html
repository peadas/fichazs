<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;600&family=Cinzel:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#101415;--card:#181d1f;--card2:#1e2527;--ink:#eef0ee;--muted:#8f9a99;--line:#2f3739;--gold:#e9ece7;--gold2:#a9b3b1;--pv:#e0524f;--pd:#4f9fe0;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#07090a;color:var(--ink);font:15px/1.4 Barlow,system-ui,sans-serif}
.fundo{position:fixed;inset:0;z-index:0;background:#07090a url(moldura-menu.jpg) center/100% 100% no-repeat}
main{position:absolute!important;inset:15px 14px;overflow-y:auto;overflow-x:hidden;padding:14px 16px 22px;scrollbar-width:thin;scrollbar-color:#5c6668 transparent}
.wrap{max-width:520px;margin:0 auto}
button{font:600 .95rem Barlow,sans-serif;color:var(--ink);background:transparent;border:1px solid var(--line);padding:8px 14px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--gold2);color:var(--gold)}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
@keyframes glow{50%{box-shadow:0 0 0 6px #ffffff14,0 8px 30px #ffffff22}}

/* topo */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{width:42px;height:42px;flex:none;display:grid;place-items:center;border:1px solid var(--gold2);background:linear-gradient(145deg,#1b2224,#0b0e0f);transform:rotate(45deg);margin:4px 6px 4px 4px}
.logo svg{width:24px;height:24px;transform:rotate(-45deg)}
.top h1{margin:0;font:800 1.7rem/1 Cinzel,serif;color:var(--gold);letter-spacing:.08em}
.top p{margin:3px 0 0;color:var(--muted);font-size:.9rem}
.hbtn{margin-left:auto;padding:7px 14px;font:800 .9rem "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;border-color:var(--gold2);color:var(--gold);background:#141a1b}
.hbtn:hover{background:var(--gold2);color:#15191a}
.chip{font:700 .75rem "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border:1px solid var(--line);color:var(--muted)}
.chip.gm{border-color:var(--gold2);color:var(--gold)}

/* abas (mestre) */
.tabs{display:flex;gap:4px;margin:0 0 16px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:9px 16px;font:700 1rem "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
.tabs b{background:var(--gold2);color:#15191a;font-size:.7rem;padding:1px 6px;margin-left:6px;border-radius:9px}

/* convite para entrar */
.join{position:relative;text-align:center;padding:30px 22px 24px;margin-bottom:20px;border:1px solid var(--gold2);background:linear-gradient(180deg,#141a1bcc,#0e1213dd);animation:up .4s both}
.join::before,.join::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--gold);}
.join::before{left:-1px;top:-1px;border-right:0;border-bottom:0}.join::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.ring{width:84px;height:84px;margin:0 auto 14px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--gold2);background:radial-gradient(circle,#2b3436,#0b0e0f);animation:glow 3s infinite}
.ring svg{width:46px;height:46px}
.join h2{margin:0 0 6px;font:800 1.35rem Cinzel,serif;color:var(--gold);letter-spacing:.05em}
.join p{margin:0 auto 18px;max-width:340px;color:#b9c0be}
button.go{width:100%;padding:14px;font:800 1.15rem "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#15191a;border:0;background:linear-gradient(180deg,#f3f5f1,#a9b3b1);box-shadow:0 6px 20px #ffffff22}
button.go:hover{filter:brightness(1.08);color:#15191a}

/* aviso */
.status{display:flex;align-items:center;gap:8px;margin:0 0 12px;color:#9be3b4;font-weight:600}
.status i{width:9px;height:9px;border-radius:50%;background:#5fd38a;box-shadow:0 0 8px #5fd38a}
.tip{margin:0 0 14px;padding:11px 13px;border-left:3px solid var(--gold2);background:#141a1b;color:#dfe4e1;font-size:.92rem}

h3.sec{display:flex;align-items:center;gap:10px;margin:18px 0 10px;font:700 .95rem "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h3.sec::after{content:"";flex:1;height:1px;background:var(--line)}

/* cartões */
.card{position:relative;display:flex;gap:14px;align-items:center;padding:12px 12px 12px 16px;margin-bottom:10px;background:linear-gradient(180deg,#1e2527cc,#121718dd);border:1px solid #4a5456;box-shadow:0 4px 18px #0008}
.anim .card{animation:up .35s both}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,#e9ece7)}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--gold2)}
.av{width:72px;height:72px;flex:none;display:grid;place-items:center;background:#0e1213 center/cover no-repeat;border:1px solid #3a4344;font:800 1.9rem Cinzel,serif;color:var(--c,#e9ece7)}
.in{flex:1;min-width:0}
.nm{display:flex;align-items:baseline;gap:8px;min-width:0}
.nm b{font:700 1.3rem/1.1 "Barlow Condensed",sans-serif;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c,#e9ece7)}
.tag{font:700 .66rem "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:1px 7px;border:1px solid var(--line);color:var(--muted);flex:none}
.tag.me{border-color:#5fd38a;color:#5fd38a}.tag.npc{border-color:var(--gold2);color:var(--gold)}
.sub{color:var(--muted);font-size:.82rem;margin:1px 0 6px;min-height:1.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;margin-top:5px}
.st span{font:700 .78rem "Barlow Condensed",sans-serif;letter-spacing:.1em;color:var(--muted)}
.st i{display:block;height:9px;background:#0e1213;border:1px solid #2b3335;overflow:hidden}
.st u{display:block;height:100%;transition:width .4s}
.pv u{background:linear-gradient(90deg,#a82f2d,#f0655f)}.pd u{background:linear-gradient(90deg,#2d6fa8,#63b5f2)}
.st em{font:700 .95rem "Barlow Condensed",sans-serif;font-style:normal;min-width:44px;text-align:right}
.fb{align-self:stretch;display:grid;place-items:center;padding:0 9px;font:700 .72rem "Barlow Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;border-color:var(--gold2);color:var(--gold);background:#141a1b}
.fb:hover{background:var(--gold2);color:#15191a}
.leave{margin-top:12px;text-align:center}.leave button{border:0;color:var(--muted);font-size:.88rem;text-decoration:underline}
/* cartões na tela do Owlbear */
.hudset{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;margin:0 0 6px;border:1px solid var(--line);background:#141a1bcc}
.hudset .t{flex:1;min-width:150px;font:700 .98rem "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase}
.sw{width:46px;height:24px;border-radius:12px;border:1px solid #8b9594;background:#0a0c0d;position:relative;padding:0;flex:none}
.sw i{position:absolute;top:2px;left:3px;width:16px;height:16px;border-radius:50%;background:#8f9a99;transition:left .2s,background .2s}
.sw[aria-checked="true"]{border-color:#e9ece7}
.sw[aria-checked="true"] i{left:25px;background:#e9ece7}
.hudset .org{display:inline-flex;align-items:center;gap:7px;padding:6px 12px}
.hudset .org svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hudset .org:disabled{opacity:.4;cursor:default}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line)}

/* PV / PD segmentados */
.vit{display:grid;grid-template-columns:30px 36px auto 1fr;gap:4px 7px;align-items:center;margin-top:7px}
.vl{font:800 1.08rem Cinzel,serif;letter-spacing:.03em;color:#f4f5f2}
.vn{font:800 1.75rem/1 Cinzel,serif;text-align:right;color:#f4f5f2;text-shadow:0 0 10px #ffffff33}
.vm{font:700 .82rem Cinzel,serif;color:#a9b3b1;white-space:nowrap}
.vb{display:flex;gap:3px;min-width:0;padding:4px 0}
.vs{flex:1 1 0;min-width:3px;max-width:17px;height:11px;padding:0;border:1px solid #e4e7e2;background:transparent;transform:skewX(-14deg);cursor:default;border-radius:0;display:block}
.vs.on{background:#f4f5f2}
.vit.ed .vs{cursor:pointer}
.vit.ed .vs:hover{border-color:#fff;background:#ffffff66}
.vit.ed .vs.on:hover{background:#fff}
.vs:hover{color:inherit}
.pvv .vs.on{box-shadow:0 0 8px #ff6a6a66}.pdv .vs.on{box-shadow:0 0 8px #6ab4ff66}
/* NPCs */
.form{display:grid;grid-template-columns:1fr 70px 70px;gap:8px;padding:12px;margin-bottom:16px;border:1px solid var(--line);background:var(--card)}
.form label{display:block;font:700 .7rem "Barlow Condensed",sans-serif;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
.form input{width:100%;font:600 1rem Barlow,sans-serif;color:var(--ink);background:#0e1213;border:1px solid var(--line);padding:8px 9px}
.form input:focus{outline:none;border-color:var(--gold2)}
.form button{grid-column:1/-1;padding:10px;font:800 1rem "Barlow Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;border-color:var(--gold2);color:var(--gold)}
.form button:hover{background:var(--gold2);color:#15191a}
.nacts{display:flex;gap:6px;margin-top:9px}
.nacts button{padding:5px 11px;font-size:.82rem}
.nacts .sp{flex:1}
.nacts .on{border-color:#5fd38a;color:#5fd38a}
.nacts .eye{display:grid;place-items:center;padding:4px 9px}
.nacts .eye svg{width:20px;height:20px;display:block}
.nacts .eye.off{border-color:#e0524f;color:#ff8f8c;background:#2a1413}
.nacts .del.arm{border-color:var(--pv);color:var(--pv)}
.st .adj{display:flex;align-items:center;gap:4px}
.st .adj button{padding:0;width:22px;height:20px;line-height:1;font-size:.95rem}
.ncard{display:block}
.ncard .row{display:flex;gap:14px;align-items:center}
/* aba Esconder */
.tabs button{padding:9px 13px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.ab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:12px 6px 10px;border:1px solid #4a5456;background:linear-gradient(180deg,#1e2527cc,#121718dd);font:700 .82rem/1.1 "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;text-align:center}
.ab svg{width:30px;height:30px;display:block}
.ab.on{border-color:var(--gold);color:var(--gold);background:#232c2e}
.pnl{padding:12px;margin:0 0 14px;border:1px solid var(--line);background:var(--card)}
.pnl h4{display:flex;align-items:center;gap:8px;margin:0 0 9px;font:700 .95rem "Barlow Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2)}
.pnl h4 .sp{flex:1}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;margin:0 0 6px;border:1px solid var(--line);background:#0e1213}
.opt.on{border-color:var(--gold2);background:#1a2123}
.opt .rd{width:13px;height:13px;flex:none;border-radius:50%;border:2px solid #8b9594}
.opt.on .rd{border-color:var(--gold);background:var(--gold)}
.skrow{display:flex;align-items:center;gap:8px;margin:10px 0;flex-wrap:wrap}
.skrow b{font:700 1rem "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chips button,button.small{padding:4px 10px;font-size:.82rem}
.chips button.on,button.small.on{border-color:var(--gold2);color:var(--gold)}
.mdice{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.md{position:relative;width:44px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #cfd6d3;background:#10161a;padding:0;line-height:1}
.md b{font:800 1.3rem Cinzel,serif}.md small{font:600 .65rem "Barlow Condensed",sans-serif;color:#9aa4a3;margin-top:2px}
.md.q{border-style:dashed}.md.q b{color:#8b9594}
.md.found{border-color:#e0524f;background:#3a1514}
.md.pick{border-color:var(--pv);animation:espulse2 .9s infinite}
@keyframes espulse2{50%{opacity:.55}}
.md .x{position:absolute;right:-6px;top:-7px;width:17px;height:17px;display:grid;place-items:center;border-radius:50%;background:#2a3234;border:1px solid #8b9594;font-size:.7rem;color:#e9ece7}
.stp{display:inline-flex;align-items:center;gap:4px}
.stp .sv{min-width:46px;text-align:center;font:700 1.05rem "Barlow Condensed",sans-serif;letter-spacing:.06em}
.stp button{padding:3px 10px}
.row2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.ev1{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line);font-size:.86rem}
.ev1 b{font:800 1rem Cinzel,serif;color:var(--gold2);min-width:22px}
.ev1 span{flex:1;color:var(--muted)}
.emsg{margin:8px 0 0;color:var(--gold);font-weight:600;font-size:.9rem}
#v-esc input.t{background:#0e1213;border:1px solid var(--line);color:#eef0ee;padding:6px 8px;font:inherit;min-width:0}
</style>
</head>
<body>
<div class="fundo"></div>
<main><div class="wrap">
  <header class="top">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#e9ece7" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2.5 20.5 7.5v9L12 21.5 3.5 16.5v-9z"/><path d="M12 2.5v6.5m0 0-8.5-1.5M12 9l8.5-1.5M12 9v12.5M12 9l-5.5 8.5M12 9l5.5 8.5"/></svg></div>
    <div><h1>MESA</h1><p id="sub"></p></div>
    <button class="hbtn" id="b-ficha" title="Abrir a minha ficha">Ficha</button>
    <span class="chip" id="role"></span>
  </header>
  <nav class="tabs" id="tabs" hidden>
    <button data-t="mesa" class="on">Mesa</button>
    <button data-t="npc" id="t-npc">NPCs<b id="nc" hidden></b></button>
    <button data-t="esc">Esconder</button>
  </nav>
  <section id="v-mesa">
    <div id="top"></div>
    <div class="hudset"><button class="sw" id="tray-sw" type="button" role="switch" aria-checked="false" aria-label="Mesa de dados sempre visível"><i></i></button><span class="t">Mesa de dados sempre visível</span></div>
    <div class="hudset"><button class="sw" id="hud-sw" type="button" role="switch" aria-checked="true" aria-label="Mostrar cartões na tela"><i></i></button><span class="t">Cartões na tela</span><button class="org" id="hud-org" type="button" title="Arrastar os cartões para onde quiser na tela do Owlbear"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3 9 6m3-3 3 3M12 21l-3-3m3 3 3-3M3 12l3-3m-3 3 3 3M21 12l-3-3m3 3-3 3"/></svg>Organizar</button></div>
    <h3 class="sec" id="h2">Na mesa</h3>
    <div id="list"></div>
    <div class="leave" id="leave"></div>
  </section>
  <section id="v-esc" hidden></section>
  <section id="v-npc" hidden>
    <div class="form">
      <div><label for="n-nome">Nome do NPC</label><input id="n-nome" placeholder="Ex.: Cultista" autocomplete="off"></div>
      <div><label for="n-pv">PV</label><input id="n-pv" type="number" min="1" value="10"></div>
      <div><label for="n-pd">PD</label><input id="n-pd" type="number" min="0" value="10"></div>
      <button id="n-add">Criar NPC</button>
    </div>
    <h3 class="sec">Seus NPCs</h3>
    <div id="nlist"></div>
  </section>
</div></main>
<script src="efeitos.js?v=2.10.0"></script>
<script type="module">
import {loadOBR,ready} from "./obr.js?v=2.10.0";
import {K_P,K_G,normP,normG,FACES,MAXD,SKILLS,WAYS,EVENTS,ICON,skillDice} from "./esconder-lib.js?v=2.10.0";
import {KEY,LS,store,npcs,saveNpcs,npcSheet,setNpcSheet,npcImg,npcDel,npcInfo,npcAdjust,npcSet,npcOlho,npcsOf,mineLive,setMine,openFicha,openGm,publishMine,unpublishMine,storageOk} from "./mesa-lib.js?v=2.10.0";
const $=s=>document.querySelector(s),abs=p=>new URL(p,location.href).href;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let OBR=null,self=null,party=[],role="PLAYER",tab="mesa",armed="",wantJoin=null,pubErr="";
const stOK=storageOk();
/* "estou na mesa?": o que eu cliquei agora manda; senão vale a marca salva ou a minha ficha já estar publicada na sala */
const joined=()=>wantJoin!==null?wantJoin:(store.get(LS.joined)==="1"||!!(self&&self.metadata&&self.metadata[KEY]));
async function doPublish(){
  pubErr="";
  try{await publishMine(OBR,self&&self.name)}catch(e){console.warn("[mesa] não consegui publicar a ficha",e);pubErr="Não consegui colocar você na mesa agora. Tente de novo em alguns segundos."}
}
const hasName=()=>{try{const d=JSON.parse(store.get(LS.sheet)||"{}");return !!((d.nome||"").trim()||(d.sob||"").trim())}catch(e){return false}};
const nudge=()=>OBR&&OBR.broadcast.sendMessage("ordem.mesa/nudge",{},{destination:"LOCAL"}).catch(()=>{});
const D20='<svg viewBox="0 0 24 24" fill="none" stroke="#e9ece7" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2.5 20.5 7.5v9L12 21.5 3.5 16.5v-9z"/><path d="M12 2.5v6.5m0 0-8.5-1.5M12 9l8.5-1.5M12 9v12.5M12 9l-5.5 8.5M12 9l5.5 8.5"/></svg>';

/* PV/PD em segmentos (estilo da imagem). Com "set", cada segmento é clicável: clicar no último cheio tira um. */
function vit(cls,l,cur,max,set){
  const r=el("div","vit "+cls+"v"+(set?" ed":""));
  r.append(el("span","vl",l),el("b","vn",String(cur)),el("span","vm","/ "+max));
  const bar=el("div","vb"),n=Math.min(60,Math.max(0,max));
  for(let k=0;k<n;k++){
    const sg=el(set?"button":"span","vs"+(k<cur?" on":""));
    if(set){sg.type="button";sg.setAttribute("aria-label",l+" "+(k+1));sg.onclick=ev=>{ev.stopPropagation();set(k+1===cur?k:k+1)}}
    bar.append(sg);
  }
  r.append(bar);return r;
}
const EYE_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3.2"/></svg>';
const EYE_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z" opacity=".55"/><circle cx="12" cy="12" r="3.2" opacity=".55"/><path d="M3 3l18 18"/></svg>';
/* grava e atualiza a sala sem precisar abrir a ficha */
let pubT=0;
const sync=()=>{clearTimeout(pubT);pubT=setTimeout(async()=>{if(OBR){if(joined())await doPublish();nudge();await refresh()}},250)};
function avatar(th,nome){const a=el("div","av");if(th)a.style.backgroundImage="url("+th+")";else a.textContent=(nome||"?").trim().charAt(0).toUpperCase()||"?";return a}

/* cartão de jogador / NPC mostrado na mesa */
function card(p,mine,i){
  const e=p.metadata[KEY],c=el("div","card"),nome=e.nome||p.name||"Jogador";
  c.style.setProperty("--c",p.color||"#e9ece7");c.style.animationDelay=(i*50)+"ms";
  const inn=el("div","in"),nm=el("div","nm");nm.append(el("b",null,nome));
  if(mine)nm.append(el("span","tag me","você"));if(p.isNpc)nm.append(el("span","tag npc","NPC"));
  const mineNpc0=p.isNpc&&role==="GM"&&npcs().some(n=>n.id===p.npc);
  let v=e,setPv=null,setPd=null;
  if(mine){v={...e,...mineLive()};setPv=x=>{setMine("pv",x);render();sync()};setPd=x=>{setMine("pd",x);render();sync()}}
  else if(mineNpc0){const f=npcInfo(p.npc);v={...e,pv:f.pv,pvmax:f.pvmax,pd:f.pd,pdmax:f.pdmax};setPv=x=>{npcSet(p.npc,"pv",x);render();sync()};setPd=x=>{npcSet(p.npc,"pd",x);render();sync()}}
  inn.append(nm,el("div","sub",[e.perfil,e.nivel&&!p.isNpc?"Nível "+e.nivel:""].filter(Boolean).join(" · ")),vit("pv","PV",v.pv,v.pvmax,setPv),vit("pd","PD",v.pd,v.pdmax,setPd));
  c.append(avatar(e.th,nome),inn);
  if(mine){const b=el("button","fb","Ficha");b.title="Abrir minha ficha";b.onclick=()=>openFicha(OBR);c.append(b)}
  const mineNpc=p.isNpc&&role==="GM"&&npcs().some(n=>n.id===p.npc);
  if(mineNpc){c.classList.add("click");c.title="Abrir a ficha do NPC";c.onclick=()=>openFicha(OBR,p.npc)}
  else if(role==="GM"&&!p.isNpc){c.classList.add("click");c.title="Abrir e editar a ficha do jogador";c.onclick=()=>openGm(OBR,p.id)}
  return c;
}

let kM="",kN="",anim=true,refresh=async()=>{};
const ent=p=>[p.id,p.isNpc?1:0,p.color,p.name,p.metadata&&p.metadata[KEY]];
function renderMesa(){
  const base=[self,...party].filter(Boolean),key=JSON.stringify([role,joined(),hasName(),stOK,pubErr,base.map(ent),npcsOf(base).map(ent),npcs(),mineLive(),npcs().map(n=>npcInfo(n.id))]);
  if(key===kM)return;kM=key;
  const j=joined(),top=$("#top"),list=$("#list"),leave=$("#leave");
  top.replaceChildren();list.replaceChildren();leave.replaceChildren();
  if(!stOK&&role!=="GM")top.append(el("div","tip","Seu navegador está bloqueando o armazenamento deste site dentro do Owlbear, então a ficha pode não ser salva. Libere cookies e dados de sites de terceiros para o Owlbear Rodeo (ou use outra janela do navegador) e recarregue."));
  if(role==="GM"){
    $("#sub").textContent="Clique num jogador para abrir e editar a ficha dele.";
  }else if(!j){
    $("#sub").textContent="Sua sessão começa aqui.";
    const h=el("div","join");
    const ring=el("div","ring");ring.innerHTML=D20;
    const b=el("button","go","Entrar na mesa");b.onclick=async()=>{b.disabled=true;wantJoin=true;store.set(LS.joined,"1");render();if(OBR){await doPublish();nudge();await refresh()}render()};
    h.append(ring,el("h2",null,"Pronto para a sessão?"),el("p",null,"Entre na mesa para aparecer para todos com foto, PV e PD. Você começa com um personagem em branco e preenche a ficha depois."),b);
    top.append(h);
  }else{
    $("#sub").textContent="Você está na mesa.";
    const s=el("div","status");s.append(el("i"),el("span",null,"Você está na mesa"));top.append(s);
    if(pubErr)top.append(el("div","tip",pubErr));
    if(!hasName())top.append(el("div","tip","Seu personagem entrou em branco. Toque em FICHA no seu cartão e preencha nome, foto, PV e PD para aparecer bonitinho para todos."));
    const out=el("button",null,"Sair da mesa");
    out.onclick=async()=>{wantJoin=false;store.set(LS.joined,"0");if(self&&self.metadata)self.metadata={...self.metadata,[KEY]:undefined};render();
      if(OBR){try{await unpublishMine(OBR)}catch(e){console.warn("[mesa] não consegui sair da mesa",e)}nudge();await refresh()}render()};
    leave.append(out);
  }
  const all=[];
  if(self&&self.metadata&&self.metadata[KEY])all.push([self,true]);
  party.forEach(p=>{if(p.metadata&&p.metadata[KEY])all.push([p,false])});
  npcsOf([self,...party].filter(Boolean)).forEach(n=>all.push([n,false]));
  $("#h2").textContent="Na mesa"+(all.length?" · "+all.length:"");
  if(!all.length)list.append(el("div","empty",j&&role!=="GM"?"Entrando na mesa…":"Ninguém entrou ainda."));
  all.forEach(([p,m],i)=>list.append(card(p,m,i)));
}

/* ---- aba NPCs (só o mestre) ---- */
function renderNpcs(){
  const key=JSON.stringify([npcs().map(n=>[n,npcInfo(n.id),(npcImg(n.id)||"").length]),armed]);
  if(key===kN)return;kN=key;
  const list=$("#nlist"),a=npcs();list.replaceChildren();
  $("#nc").hidden=!a.length;$("#nc").textContent=a.length;
  if(!a.length)list.append(el("div","empty","Nenhum NPC ainda. Crie o primeiro acima."));
  a.forEach((n,i)=>{
    const f=npcInfo(n.id),c=el("div","card ncard");c.style.setProperty("--c","#c9b27a");c.style.animationDelay=(i*40)+"ms";
    const row=el("div","row"),inn=el("div","in"),nm=el("div","nm");nm.append(el("b",null,f.nome),el("span","tag npc","NPC"));
    inn.append(nm,el("div","sub",f.perfil||""),
      vit("pv","PV",f.pv,f.pvmax,x=>{npcSet(n.id,"pv",x);nudge();renderNpcs()}),
      vit("pd","PD",f.pd,f.pdmax,x=>{npcSet(n.id,"pd",x);nudge();renderNpcs()}));
    row.append(avatar(npcImg(n.id),f.nome),inn);
    const acts=el("div","nacts");
    const fb=el("button",null,"Ficha");fb.onclick=()=>openFicha(OBR,n.id);
    const eye=el("button","eye"+(n.oculto?" off":""));eye.innerHTML=n.oculto?EYE_OFF:EYE_ON;
    eye.title=n.oculto?"Olho fechado: os dados deste NPC ficam ocultos dos jogadores (só você vê)":"Olho aberto: os jogadores veem os dados deste NPC. Clique para ocultar";
    eye.setAttribute("aria-label",eye.title);eye.setAttribute("aria-pressed",String(!!n.oculto));
    eye.onclick=()=>{npcOlho(n.id);renderNpcs()};
    const sh=el("button",n.shown?"on":null,n.shown?"● Na mesa":"Mostrar na mesa");
    sh.title=n.shown?"Clique para esconder dos jogadores":"Clique para os jogadores verem este NPC";
    sh.onclick=()=>{const l=npcs();const x=l.find(y=>y.id===n.id);if(x){x.shown=!x.shown;saveNpcs(l)}nudge();render()};
    const del=el("button","del"+(armed===n.id?" arm":""),armed===n.id?"Confirmar?":"Excluir");
    del.onclick=()=>{
      if(armed!==n.id){armed=n.id;renderNpcs();setTimeout(()=>{if(armed===n.id){armed="";renderNpcs()}},3000);return}
      armed="";npcDel(n.id);nudge();render();
    };
    acts.append(fb,eye,sh,el("span","sp"),del);
    c.append(row,acts);list.append(c);
  });
}
$("#n-add").onclick=()=>{
  const nome=$("#n-nome").value.trim()||"NPC",pv=Math.max(1,parseInt($("#n-pv").value,10)||10),pd=Math.max(0,parseInt($("#n-pd").value,10)||10);
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  setNpcSheet(id,{nome,pv,pvmax:pv,pd,pdmax:pd});
  saveNpcs([...npcs(),{id,shown:false}]);
  $("#n-nome").value="";render();
};

function render(){
  const gm=role==="GM";
  $("#role").textContent=gm?"Mestre":"Jogador";$("#role").classList.toggle("gm",gm);
  $("#tabs").hidden=false;$("#t-npc").hidden=!gm;
  if(!gm&&tab==="npc")tab="mesa";
  $("#v-mesa").hidden=tab!=="mesa";$("#v-npc").hidden=tab!=="npc";$("#v-esc").hidden=tab!=="esc";
  document.body.classList.toggle("anim",anim);
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  if(gm)$("#nc").textContent=npcs().length,$("#nc").hidden=!npcs().length;
  renderMesa();if(gm&&tab==="npc")renderNpcs();if(tab==="esc")renderEsc();
  if(anim)setTimeout(()=>{anim=false;document.body.classList.remove("anim")},700);
}
/* cartões na tela: liga/desliga (cada jogador decide para a própria tela) */
const hudOn=()=>store.get("hud-on")!=="0";
function drawHud(){$("#hud-sw").setAttribute("aria-checked",String(hudOn()));$("#hud-org").disabled=!hudOn()}
$("#hud-sw").onclick=()=>{store.set("hud-on",hudOn()?"0":"1");drawHud();if(OBR)OBR.broadcast.sendMessage("ordem.hud/cfg",{},{destination:"LOCAL"}).catch(()=>{})};
const trayOn=()=>store.get("tray-always")==="1";
function drawTray(){$("#tray-sw").setAttribute("aria-checked",String(trayOn()))}
$("#tray-sw").onclick=()=>{store.set("tray-always",trayOn()?"0":"1");drawTray();if(OBR)OBR.broadcast.sendMessage("ordem.hud/cfg",{},{destination:"LOCAL"}).catch(()=>{})};
drawTray();
drawHud();
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;kM=kN=kE="";anim=true;render()});
addEventListener("storage",()=>{if(role==="GM"&&tab==="npc")renderNpcs();else if(tab==="mesa")renderMesa();else if(tab==="esc")renderEsc()});

/* ================= aba Esconder ================= */
const E={act:"",way:0,skill:"Furtividade",custom:false,face:8,qty:1,addFace:6,discard:false,msg:"",evOpen:false};
let kE="",msgT=0,nums="",stTxt=null;
const gmSt=()=>{
  if(role==="GM")return normG(self&&self.metadata&&self.metadata[K_G]);
  const p=party.find(x=>x.role==="GM");return normG(p&&p.metadata&&p.metadata[K_G]);
};
const mineSt=()=>normP(self&&self.metadata&&self.metadata[K_P]);
const escLoc=()=>store.get("esc-on")==="1";
const stepF=(f,dir)=>{const a=FACES;let i=a.indexOf(f);return a[Math.max(0,Math.min(a.length-1,i+dir))]};
const mk=(t,cls,txt,fn,title)=>{const b=el(t,cls,txt);if(t==="button")b.type="button";if(title)b.title=title;if(fn)b.onclick=fn;return b};
function say(t,ms){E.msg=t||"";clearTimeout(msgT);if(t)msgT=setTimeout(()=>{E.msg="";renderEsc()},ms||3500);renderEsc()}
function sw(label,on,fn){const r=el("div","hudset"),b=el("button","sw");b.type="button";b.setAttribute("role","switch");b.setAttribute("aria-checked",String(on));b.setAttribute("aria-label",label);b.append(el("i"));b.onclick=fn;r.append(b,el("span","t",label));return r}
function stp(text,minus,plus){const w=el("div","stp");w.append(mk("button","small","−",minus),el("span","sv",text),mk("button","small","+",plus));return w}
const cfgPing=()=>OBR&&OBR.broadcast.sendMessage("ordem.hud/cfg",{},{destination:"LOCAL"}).catch(()=>{});
const setP=async patch=>{if(!OBR)return;const cur=mineSt();await OBR.player.setMetadata({[K_P]:{...cur,...patch}});await refresh()};
const setG=async patch=>{if(!OBR)return;const cur=gmSt();await OBR.player.setMetadata({[K_G]:{...cur,...patch}});await refresh()};
/* manda rolar na camada do Owlbear; se o painel ainda não está ligado, liga e espera a camada abrir */
function rollEsc(dice,names,title,esc){
  if(!OBR){say("Abra esta página dentro do Owlbear Rodeo.");return}
  const go=()=>OBR.broadcast.sendMessage("ordem.hud/quickroll",{dice:dice.map(f=>[1,f]),names,title,exp:title,esc},{destination:"LOCAL"}).catch(()=>{});
  if(escLoc()||gmSt().on)go();
  else{store.set("esc-on","1");cfgPing();say("Abrindo o painel…",2200);setTimeout(go,2200)}
}
function doHide(){
  const sk=E.skill,dd=skillDice(sk);
  rollEsc(dd.map(x=>x.f),dd.map(x=>x.n),"Esconder-se",{k:"hide",sk});
  E.act="";say("Escondendo-se com "+sk+"…");
}
function addDie(){
  if(mineSt().dice.length>=MAXD){say("Máximo de "+MAXD+" dados.");return}
  rollEsc([E.addFace],["d"+E.addFace],"Novo esconderijo",{k:"add"});
}
async function rmDie(i){const p=mineSt();E.discard=false;await setP({dice:p.dice.filter((_,j)=>j!==i)})}
async function loud(){
  const p=mineSt();
  await setP({note:{k:"loud",t:Date.now()}});
  if(p.dice.length){E.discard=true;say("Ação chamativa: toque no dado que você vai descartar.",6000)}else say("Chamou atenção.");
}
async function distract(){await setP({note:{k:"distract",t:Date.now()}});say("Você distraiu a criatura. O painel avisa a mesa.")}
function diceRow(st,g,onPick,viewGM){
  const row=el("div","mdice");
  st.dice.forEach((d,i)=>{
    const found=g.calls.includes(d.v),show=!viewGM||found;
    const b=mk("button","md"+(found?" found":"")+(show?"":" q")+(E.discard?" pick":""),null,onPick?()=>onPick(i):null,d.n||("d"+d.f));
    b.append(el("b",null,show?String(d.v):"?"),el("small",null,"d"+d.f));
    if(onPick&&!E.discard)b.append(el("span","x","×"));
    row.append(b);
  });
  return row;
}
function renderEsc(){
  const g=gmSt(),st=mineSt(),gm=role==="GM";
  const key=JSON.stringify([role,g,gm?0:st,escLoc(),E,gm?0:skillDice(E.skill)]);
  if(key===kE)return;kE=key;
  const box=$("#v-esc");box.replaceChildren();
  if(!OBR)box.append(el("div","tip","Abra esta página dentro do Owlbear Rodeo."));
  /* painel na tela */
  const top=el("div","pnl");top.append(el("h4",null,"Painel na tela"));
  if(gm){
    top.append(sw("Mostrar o painel para todos",g.on,()=>setG({on:!g.on})));
    const r=el("div","row2");r.append(el("span","t","Subtítulo"));
    const i=el("input","t");i.value=stTxt!=null?stTxt:g.st;i.maxLength=40;i.setAttribute("aria-label","Subtítulo do painel");
    i.oninput=()=>{stTxt=i.value};i.onchange=()=>{const v=i.value.trim()||"Caçando";stTxt=null;setG({st:v})};r.append(i);top.append(r);
  }else top.append(sw("Mostrar o painel na minha tela",escLoc()||g.on,()=>{store.set("esc-on",escLoc()?"0":"1");cfgPing();kE="";renderEsc()}));
  const sz=el("div","row2");sz.append(el("span","t","Tamanho"),mk("button","small","−",()=>OBR&&OBR.broadcast.sendMessage("ordem.esc/size",{d:-.1},{destination:"LOCAL"})),mk("button","small","+",()=>OBR&&OBR.broadcast.sendMessage("ordem.esc/size",{d:.1},{destination:"LOCAL"})),mk("button","small","Restaurar",()=>OBR&&OBR.broadcast.sendMessage("ordem.esc/reset",{},{destination:"LOCAL"})));
  top.append(sz,el("p","hint","Arraste o título do painel na tela para mover; a roda do mouse sobre o título muda o tamanho."));
  box.append(top);
  if(gm)renderGm(box,g);else renderPlayer(box,g,st);
  if(E.msg)box.append(el("p","emsg",E.msg));
}
function renderPlayer(box,g,st){
  const a=el("div","acts");
  [["hide","Esconder-se",()=>{E.act=E.act==="hide"?"":"hide";E.discard=false;renderEsc()}],["distract","Distrair",distract],["loud","Chamar atenção",loud]].forEach(([k,t,fn])=>{
    const b=mk("button","ab"+(E.act===k?" on":""),null,fn,t);b.innerHTML=ICON[k];b.append(el("span",null,t));a.append(b);
  });
  box.append(a);
  if(E.act==="hide"){
    const p=el("div","pnl");p.append(el("h4",null,"Como você vai se esconder?"));
    WAYS.forEach((w,i)=>{const o=mk("button","opt"+(E.way===i?" on":""),null,()=>{E.way=i;renderEsc()});o.append(el("span","rd"),el("span",null,w[0]));p.append(o)});
    const r=el("div","skrow");r.append(el("span","t","Perícia:"),el("b",null,E.skill),mk("button","small"+(E.custom?" on":""),"Personalizar",()=>{E.custom=!E.custom;renderEsc()}));p.append(r);
    if(E.custom){const c=el("div","chips");SKILLS.forEach(([n])=>c.append(mk("button",E.skill===n?"on":"",n,()=>{E.skill=n;renderEsc()})));p.append(c)}
    const dd=skillDice(E.skill);
    p.append(el("p","hint","Rola "+dd.map(x=>"d"+x.f+" ("+x.n+")").join(" + ")+" e cada resultado vira um dado de esconderijo."));
    p.append(mk("button","go","Rolar esconderijo",doHide));
    box.append(p);
  }
  const d=el("div","pnl");d.append(el("h4",null,"Seus dados de esconderijo"));
  if(st.dice.length)d.append(diceRow(st,g,rmDie,false));
  else d.append(el("p","hint",st.h?"Você foi descoberto! Esconda-se de novo para voltar.":"Você ainda não tem dados. Use Esconder-se."));
  const r=el("div","row2");r.append(el("span","t","Adicionar"),stp("d"+E.addFace,()=>{E.addFace=stepF(E.addFace,-1);renderEsc()},()=>{E.addFace=stepF(E.addFace,1);renderEsc()}),mk("button","small","+ dado",addDie));
  d.append(r,el("p","hint","Toque num dado para removê-lo."));
  box.append(d);
}
function renderGm(box,g){
  const c=el("div","pnl");c.append(el("h4",null,"Criatura"));
  c.append(sw("Descartar dados revelados sozinho",g.ap,()=>setG({ap:!g.ap})));
  const r=el("div","row2");
  r.append(el("span","t","Dado"),stp("d"+E.face,()=>{E.face=stepF(E.face,-1);renderEsc()},()=>{E.face=stepF(E.face,1);renderEsc()}),el("span","t","Qtd"),stp(String(E.qty),()=>{E.qty=Math.max(1,E.qty-1);renderEsc()},()=>{E.qty=Math.min(8,E.qty+1);renderEsc()}));
  c.append(r);
  c.append(mk("button","go","Rolar "+E.qty+"d"+E.face+" (criatura procura)",()=>rollEsc(Array(E.qty).fill(E.face),[],"Criatura procura "+E.qty+"d"+E.face,{k:"call",msg:"A criatura procurou: "+E.qty+"d"+E.face})));
  const n=el("div","row2");n.append(el("span","t","Números"));
  const i=el("input","t");i.placeholder="ex.: 3 5";i.value=nums;i.style.width="110px";i.oninput=()=>{nums=i.value};
  const go=()=>{const a=[...new Set((nums.match(/\d+/g)||[]).map(Number).filter(x=>x>0&&x<=99))].slice(0,12);if(!a.length){say("Digite um ou mais números.");return}setG({calls:a,ct:Date.now(),msg:"O mestre chamou: "+a.join(", ")});nums="";say("Números chamados: "+a.join(", "))};
  i.onkeydown=e=>{if(e.key==="Enter")go()};
  n.append(i,mk("button","small","Revelar",go),mk("button","small","Limpar",()=>{setG({calls:[],ct:Date.now(),msg:""})}));
  c.append(n);
  if(g.calls.length)c.append(el("p","hint","Chamados agora: "+g.calls.join(", ")));
  box.append(c);
  const ev=el("div","pnl"),h=el("h4",null,"Eventos (1d10 de um jogador)");
  h.append(el("span","sp"),mk("button","small",E.evOpen?"Fechar":"Ver",()=>{E.evOpen=!E.evOpen;renderEsc()}));ev.append(h);
  if(E.evOpen)EVENTS.forEach(([k,t,dp])=>{
    const r=el("div","ev1");r.append(el("b",null,String(k)),el("span",null,t+(dp&&k>2&&k<8?" ("+dp[0]+"d"+dp[1]+")":"")));
    if(dp)r.append(mk("button","small","Usar",()=>{E.qty=dp[0];E.face=dp[1];renderEsc()}));ev.append(r);
  });
  else ev.append(el("p","hint","Resultados altos são melhores para os jogadores. Abra a lista para ver o que cada número faz."));
  box.append(ev);
  const pl=el("div","pnl");pl.append(el("h4",null,"Dados dos jogadores"));
  const ps=party.filter(x=>x.role!=="GM"&&x.metadata&&x.metadata[K_P]);
  if(!ps.length)pl.append(el("p","hint","Ninguém se escondeu ainda."));
  ps.forEach(p=>{const s=normP(p.metadata[K_P]),e=p.metadata[KEY]||{},r=el("div","row2");r.append(el("b",null,String(e.nome||p.name||"Jogador").slice(0,24)));r.append(s.dice.length?diceRow(s,g,null,true):el("span","hint",s.h?"descoberto":"—"));pl.append(r)});
  box.append(pl);
}

(async()=>{
  render();
  OBR=await loadOBR();
  if(!OBR||!(await ready(OBR))){$("#sub").textContent="Abra esta página dentro do Owlbear Rodeo.";return}
  try{await OBR.action.setWidth(480);await OBR.action.setHeight(700)}catch(e){}
  role=await OBR.player.getRole();
  const me=async()=>({id:OBR.player.id,name:await OBR.player.getName(),color:await OBR.player.getColor(),metadata:await OBR.player.getMetadata()});
  $("#b-ficha").onclick=()=>openFicha(OBR);
  $("#hud-org").onclick=async()=>{
    try{await OBR.broadcast.sendMessage("ordem.hud/arrange",{on:true},{destination:"LOCAL"})}catch(e){}
    try{await OBR.action.close()}catch(e){}
  };
  refresh=async()=>{try{role=await OBR.player.getRole();self=await me();party=await OBR.party.getPlayers();if(wantJoin!==null&&self.metadata&&!!self.metadata[KEY]===wantJoin)wantJoin=null;render()}catch(e){}};
  await refresh();
  OBR.player.onChange(p=>{self={id:p.id||self.id,name:p.name,color:p.color,metadata:p.metadata};role=p.role||role;render()});
  OBR.party.onChange(ps=>{party=ps;render()});
  setInterval(refresh,4000);                                   // garantia: a lista sempre se corrige sozinha
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
})();
</script>
