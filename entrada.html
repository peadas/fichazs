<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;600&family=Cinzel:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#101415;--card:#181d1f;--card2:#1e2527;--ink:#eef0ee;--muted:#8f9a99;--line:#2f3739;--gold:#f0d28a;--gold2:#d0a93f;--pv:#e0524f;--pd:#4f9fe0;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 Barlow,system-ui,sans-serif}
body{background:radial-gradient(120% 60% at 50% -10%,#2a2515 0,#101415 60%) no-repeat,var(--bg)}
main{padding:16px 16px 22px;max-width:520px;margin:0 auto}
button{font:600 .95rem Barlow,sans-serif;color:var(--ink);background:transparent;border:1px solid var(--line);padding:8px 14px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--gold2);color:var(--gold)}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
@keyframes glow{50%{box-shadow:0 0 0 6px #f0d28a14,0 8px 30px #d0a93f33}}

/* topo */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{width:42px;height:42px;flex:none;display:grid;place-items:center;border:1px solid var(--gold2);background:linear-gradient(145deg,#2a2515,#14110a);transform:rotate(45deg);margin:4px 6px 4px 4px}
.logo svg{width:24px;height:24px;transform:rotate(-45deg)}
.top h1{margin:0;font:800 1.7rem/1 Cinzel,serif;color:var(--gold);letter-spacing:.08em}
.top p{margin:3px 0 0;color:var(--muted);font-size:.9rem}
.hbtn{margin-left:auto;padding:7px 14px;font:800 .9rem "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;border-color:var(--gold2);color:var(--gold);background:#221d0e}
.hbtn:hover{background:var(--gold2);color:#15191a}
.chip{font:700 .75rem "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border:1px solid var(--line);color:var(--muted)}
.chip.gm{border-color:var(--gold2);color:var(--gold)}

/* abas (mestre) */
.tabs{display:flex;gap:4px;margin:0 0 16px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:9px 16px;font:700 1rem "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
.tabs b{background:var(--gold2);color:#15191a;font-size:.7rem;padding:1px 6px;margin-left:6px;border-radius:9px}

/* convite para entrar */
.join{position:relative;text-align:center;padding:30px 22px 24px;margin-bottom:20px;border:1px solid var(--gold2);background:linear-gradient(180deg,#221d0e,#15130b);animation:up .4s both}
.join::before,.join::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--gold);}
.join::before{left:-1px;top:-1px;border-right:0;border-bottom:0}.join::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.ring{width:84px;height:84px;margin:0 auto 14px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--gold2);background:radial-gradient(circle,#3a3016,#14110a);animation:glow 3s infinite}
.ring svg{width:46px;height:46px}
.join h2{margin:0 0 6px;font:800 1.35rem Cinzel,serif;color:var(--gold);letter-spacing:.05em}
.join p{margin:0 auto 18px;max-width:340px;color:#bdb79f}
button.go{width:100%;padding:14px;font:800 1.15rem "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#15191a;border:0;background:linear-gradient(180deg,#f6dea0,#d0a93f);box-shadow:0 6px 20px #d0a93f33}
button.go:hover{filter:brightness(1.08);color:#15191a}

/* aviso */
.status{display:flex;align-items:center;gap:8px;margin:0 0 12px;color:#9be3b4;font-weight:600}
.status i{width:9px;height:9px;border-radius:50%;background:#5fd38a;box-shadow:0 0 8px #5fd38a}
.tip{margin:0 0 14px;padding:11px 13px;border-left:3px solid var(--gold2);background:#221d0e;color:#e8d9b0;font-size:.92rem}

h3.sec{display:flex;align-items:center;gap:10px;margin:18px 0 10px;font:700 .95rem "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h3.sec::after{content:"";flex:1;height:1px;background:var(--line)}

/* cartões */
.card{position:relative;display:flex;gap:14px;align-items:center;padding:12px 12px 12px 16px;margin-bottom:10px;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line)}
.anim .card{animation:up .35s both}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,#ecc962)}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--gold2)}
.av{width:72px;height:72px;flex:none;display:grid;place-items:center;background:#0e1213 center/cover no-repeat;border:1px solid #3a4344;font:800 1.9rem Cinzel,serif;color:var(--c,#ecc962)}
.in{flex:1;min-width:0}
.nm{display:flex;align-items:baseline;gap:8px;min-width:0}
.nm b{font:700 1.3rem/1.1 "Barlow Condensed",sans-serif;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c,#ecc962)}
.tag{font:700 .66rem "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:1px 7px;border:1px solid var(--line);color:var(--muted);flex:none}
.tag.me{border-color:#5fd38a;color:#5fd38a}.tag.npc{border-color:var(--gold2);color:var(--gold)}
.sub{color:var(--muted);font-size:.82rem;margin:1px 0 6px;min-height:1.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;margin-top:5px}
.st span{font:700 .78rem "Barlow Condensed",sans-serif;letter-spacing:.1em;color:var(--muted)}
.st i{display:block;height:9px;background:#0e1213;border:1px solid #2b3335;overflow:hidden}
.st u{display:block;height:100%;transition:width .4s}
.pv u{background:linear-gradient(90deg,#a82f2d,#f0655f)}.pd u{background:linear-gradient(90deg,#2d6fa8,#63b5f2)}
.st em{font:700 .95rem "Barlow Condensed",sans-serif;font-style:normal;min-width:44px;text-align:right}
.fb{align-self:stretch;display:grid;place-items:center;padding:0 9px;font:700 .72rem "Barlow Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;border-color:var(--gold2);color:var(--gold);background:#221d0e}
.fb:hover{background:var(--gold2);color:#15191a}
.leave{margin-top:12px;text-align:center}.leave button{border:0;color:var(--muted);font-size:.88rem;text-decoration:underline}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line)}

/* NPCs */
.form{display:grid;grid-template-columns:1fr 70px 70px;gap:8px;padding:12px;margin-bottom:16px;border:1px solid var(--line);background:var(--card)}
.form label{display:block;font:700 .7rem "Barlow Condensed",sans-serif;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
.form input{width:100%;font:600 1rem Barlow,sans-serif;color:var(--ink);background:#0e1213;border:1px solid var(--line);padding:8px 9px}
.form input:focus{outline:none;border-color:var(--gold2)}
.form button{grid-column:1/-1;padding:10px;font:800 1rem "Barlow Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;border-color:var(--gold2);color:var(--gold)}
.form button:hover{background:var(--gold2);color:#15191a}
.nacts{display:flex;gap:6px;margin-top:9px}
.nacts button{padding:5px 11px;font-size:.82rem}
.nacts .sp{flex:1}
.nacts .on{border-color:#5fd38a;color:#5fd38a}
.nacts .del.arm{border-color:var(--pv);color:var(--pv)}
.st .adj{display:flex;align-items:center;gap:4px}
.st .adj button{padding:0;width:22px;height:20px;line-height:1;font-size:.95rem}
.ncard{display:block}
.ncard .row{display:flex;gap:14px;align-items:center}
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#f0d28a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2.5 20.5 7.5v9L12 21.5 3.5 16.5v-9z"/><path d="M12 2.5v6.5m0 0-8.5-1.5M12 9l8.5-1.5M12 9v12.5M12 9l-5.5 8.5M12 9l5.5 8.5"/></svg></div>
    <div><h1>MESA</h1><p id="sub"></p></div>
    <button class="hbtn" id="b-ficha" title="Abrir a minha ficha">Ficha</button>
    <span class="chip" id="role"></span>
  </header>
  <nav class="tabs" id="tabs" hidden>
    <button data-t="mesa" class="on">Mesa</button>
    <button data-t="npc">NPCs<b id="nc" hidden></b></button>
  </nav>
  <section id="v-mesa">
    <div id="top"></div>
    <h3 class="sec" id="h2">Na mesa</h3>
    <div id="list"></div>
    <div class="leave" id="leave"></div>
  </section>
  <section id="v-npc" hidden>
    <div class="form">
      <div><label for="n-nome">Nome do NPC</label><input id="n-nome" placeholder="Ex.: Cultista" autocomplete="off"></div>
      <div><label for="n-pv">PV</label><input id="n-pv" type="number" min="1" value="10"></div>
      <div><label for="n-pd">PD</label><input id="n-pd" type="number" min="0" value="10"></div>
      <button id="n-add">Criar NPC</button>
    </div>
    <h3 class="sec">Seus NPCs</h3>
    <div id="nlist"></div>
  </section>
</main>
<script type="module">
import {loadOBR,ready} from "./obr.js";
import {KEY,LS,store,npcs,saveNpcs,npcSheet,setNpcSheet,npcImg,npcDel,npcInfo,npcAdjust,npcsOf,openFicha,openGm} from "./mesa-lib.js";
const $=s=>document.querySelector(s),abs=p=>new URL(p,location.href).href;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let OBR=null,self=null,party=[],role="PLAYER",tab="mesa",armed="";
const joined=()=>store.get(LS.joined)==="1";
const hasName=()=>{try{const d=JSON.parse(store.get(LS.sheet)||"{}");return !!((d.nome||"").trim()||(d.sob||"").trim())}catch(e){return false}};
const nudge=()=>OBR&&OBR.broadcast.sendMessage("ordem.mesa/nudge",{},{destination:"LOCAL"}).catch(()=>{});
const D20='<svg viewBox="0 0 24 24" fill="none" stroke="#f0d28a" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2.5 20.5 7.5v9L12 21.5 3.5 16.5v-9z"/><path d="M12 2.5v6.5m0 0-8.5-1.5M12 9l8.5-1.5M12 9v12.5M12 9l-5.5 8.5M12 9l5.5 8.5"/></svg>';

function stat(cls,l,cur,max,adj){
  const r=el("div","st "+cls);r.append(el("span",null,l));
  const b=el("i"),u=el("u");u.style.width=(max>0?Math.max(0,Math.min(100,cur/max*100)):0)+"%";b.append(u);r.append(b);
  if(adj){
    const a=el("div","adj"),m=el("button",null,"−"),p=el("button",null,"+"),v=el("em",null,cur+"/"+max);
    m.onclick=e=>{e.stopPropagation();adj(-1)};p.onclick=e=>{e.stopPropagation();adj(1)};a.append(m,v,p);r.append(a);
  }else r.append(el("em",null,cur+"/"+max));
  return r;
}
function avatar(th,nome){const a=el("div","av");if(th)a.style.backgroundImage="url("+th+")";else a.textContent=(nome||"?").trim().charAt(0).toUpperCase()||"?";return a}

/* cartão de jogador / NPC mostrado na mesa */
function card(p,mine,i){
  const e=p.metadata[KEY],c=el("div","card"),nome=e.nome||p.name||"Jogador";
  c.style.setProperty("--c",p.color||"#ecc962");c.style.animationDelay=(i*50)+"ms";
  const inn=el("div","in"),nm=el("div","nm");nm.append(el("b",null,nome));
  if(mine)nm.append(el("span","tag me","você"));if(p.isNpc)nm.append(el("span","tag npc","NPC"));
  inn.append(nm,el("div","sub",[e.perfil,e.nivel&&!p.isNpc?"Nível "+e.nivel:""].filter(Boolean).join(" · ")),stat("pv","PV",e.pv,e.pvmax),stat("pd","PD",e.pd,e.pdmax));
  c.append(avatar(e.th,nome),inn);
  if(mine){const b=el("button","fb","Ficha");b.title="Abrir minha ficha";b.onclick=()=>openFicha(OBR);c.append(b)}
  const mineNpc=p.isNpc&&role==="GM"&&npcs().some(n=>n.id===p.npc);
  if(mineNpc){c.classList.add("click");c.title="Abrir a ficha do NPC";c.onclick=()=>openFicha(OBR,p.npc)}
  else if(role==="GM"&&!p.isNpc){c.classList.add("click");c.title="Abrir e editar a ficha do jogador";c.onclick=()=>openGm(OBR,p.id)}
  return c;
}

let kM="",kN="",anim=true;
const ent=p=>[p.id,p.isNpc?1:0,p.color,p.name,p.metadata&&p.metadata[KEY]];
function renderMesa(){
  const base=[self,...party].filter(Boolean),key=JSON.stringify([role,joined(),hasName(),base.map(ent),npcsOf(base).map(ent),npcs()]);
  if(key===kM)return;kM=key;
  const j=joined(),top=$("#top"),list=$("#list"),leave=$("#leave");
  top.replaceChildren();list.replaceChildren();leave.replaceChildren();
  if(role==="GM"){
    $("#sub").textContent="Clique num jogador para abrir e editar a ficha dele.";
  }else if(!j){
    $("#sub").textContent="Sua sessão começa aqui.";
    const h=el("div","join");
    const ring=el("div","ring");ring.innerHTML=D20;
    const b=el("button","go","Entrar na mesa");b.onclick=()=>{store.set(LS.joined,"1");nudge();render()};
    h.append(ring,el("h2",null,"Pronto para a sessão?"),el("p",null,"Entre na mesa para aparecer para todos com foto, PV e PD. Você começa com um personagem em branco e preenche a ficha depois."),b);
    top.append(h);
  }else{
    $("#sub").textContent="Você está na mesa.";
    const s=el("div","status");s.append(el("i"),el("span",null,"Você está na mesa"));top.append(s);
    if(!hasName())top.append(el("div","tip","Seu personagem entrou em branco. Toque em FICHA no seu cartão e preencha nome, foto, PV e PD para aparecer bonitinho para todos."));
    const out=el("button",null,"Sair da mesa");out.onclick=()=>{store.set(LS.joined,"0");nudge();render()};leave.append(out);
  }
  const all=[];
  if(self&&self.metadata&&self.metadata[KEY])all.push([self,true]);
  party.forEach(p=>{if(p.metadata&&p.metadata[KEY])all.push([p,false])});
  npcsOf([self,...party].filter(Boolean)).forEach(n=>all.push([n,false]));
  $("#h2").textContent="Na mesa"+(all.length?" · "+all.length:"");
  if(!all.length)list.append(el("div","empty",j&&role!=="GM"?"Entrando na mesa…":"Ninguém entrou ainda."));
  all.forEach(([p,m],i)=>list.append(card(p,m,i)));
}

/* ---- aba NPCs (só o mestre) ---- */
function renderNpcs(){
  const key=JSON.stringify([npcs().map(n=>[n,npcInfo(n.id),(npcImg(n.id)||"").length]),armed]);
  if(key===kN)return;kN=key;
  const list=$("#nlist"),a=npcs();list.replaceChildren();
  $("#nc").hidden=!a.length;$("#nc").textContent=a.length;
  if(!a.length)list.append(el("div","empty","Nenhum NPC ainda. Crie o primeiro acima."));
  a.forEach((n,i)=>{
    const f=npcInfo(n.id),c=el("div","card ncard");c.style.setProperty("--c","#c9b27a");c.style.animationDelay=(i*40)+"ms";
    const row=el("div","row"),inn=el("div","in"),nm=el("div","nm");nm.append(el("b",null,f.nome),el("span","tag npc","NPC"));
    inn.append(nm,el("div","sub",f.perfil||""),
      stat("pv","PV",f.pv,f.pvmax,d=>{npcAdjust(n.id,"pv",d);nudge();renderNpcs()}),
      stat("pd","PD",f.pd,f.pdmax,d=>{npcAdjust(n.id,"pd",d);nudge();renderNpcs()}));
    row.append(avatar(npcImg(n.id),f.nome),inn);
    const acts=el("div","nacts");
    const fb=el("button",null,"Ficha");fb.onclick=()=>openFicha(OBR,n.id);
    const sh=el("button",n.shown?"on":null,n.shown?"● Na mesa":"Mostrar na mesa");
    sh.title=n.shown?"Clique para esconder dos jogadores":"Clique para os jogadores verem este NPC";
    sh.onclick=()=>{const l=npcs();const x=l.find(y=>y.id===n.id);if(x){x.shown=!x.shown;saveNpcs(l)}nudge();render()};
    const del=el("button","del"+(armed===n.id?" arm":""),armed===n.id?"Confirmar?":"Excluir");
    del.onclick=()=>{
      if(armed!==n.id){armed=n.id;renderNpcs();setTimeout(()=>{if(armed===n.id){armed="";renderNpcs()}},3000);return}
      armed="";npcDel(n.id);nudge();render();
    };
    acts.append(fb,sh,el("span","sp"),del);
    c.append(row,acts);list.append(c);
  });
}
$("#n-add").onclick=()=>{
  const nome=$("#n-nome").value.trim()||"NPC",pv=Math.max(1,parseInt($("#n-pv").value,10)||10),pd=Math.max(0,parseInt($("#n-pd").value,10)||10);
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  setNpcSheet(id,{nome,pv,pvmax:pv,pd,pdmax:pd});
  saveNpcs([...npcs(),{id,shown:false}]);
  $("#n-nome").value="";render();
};

function render(){
  const gm=role==="GM";
  $("#role").textContent=gm?"Mestre":"Jogador";$("#role").classList.toggle("gm",gm);
  $("#tabs").hidden=!gm;
  if(!gm)tab="mesa";
  $("#v-mesa").hidden=tab!=="mesa";$("#v-npc").hidden=tab!=="npc";
  document.body.classList.toggle("anim",anim);
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  if(gm)$("#nc").textContent=npcs().length,$("#nc").hidden=!npcs().length;
  renderMesa();if(gm&&tab==="npc")renderNpcs();
  if(anim)setTimeout(()=>{anim=false;document.body.classList.remove("anim")},700);
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;kM=kN="";anim=true;render()});
addEventListener("storage",()=>{if(role==="GM"&&tab==="npc")renderNpcs();else if(tab==="mesa")renderMesa()});

(async()=>{
  render();
  OBR=await loadOBR();
  if(!OBR||!(await ready(OBR))){$("#sub").textContent="Abra esta página dentro do Owlbear Rodeo.";return}
  try{await OBR.action.setWidth(480);await OBR.action.setHeight(700)}catch(e){}
  role=await OBR.player.getRole();
  const me=async()=>({id:OBR.player.id,name:await OBR.player.getName(),color:await OBR.player.getColor(),metadata:await OBR.player.getMetadata()});
  $("#b-ficha").onclick=()=>openFicha(OBR);
  const refresh=async()=>{try{role=await OBR.player.getRole();self=await me();party=await OBR.party.getPlayers();render()}catch(e){}};
  await refresh();
  OBR.player.onChange(p=>{self={id:p.id||self.id,name:p.name,color:p.color,metadata:p.metadata};role=p.role||role;render()});
  OBR.party.onChange(ps=>{party=ps;render()});
  setInterval(refresh,4000);                                   // garantia: a lista sempre se corrige sozinha
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
})();
</script>
</body>
</html>
