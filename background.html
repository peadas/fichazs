<!doctype html>
<html lang="pt-BR">
<head>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm" crossorigin>
<meta charset="utf-8"><title>Ficha Ordem (segundo plano)</title></head>
<body>
<script src="engine.js?v=2.14.0"></script>
<script src="dice-style.js?v=2.14.0"></script>
<script type="module">
/* Fica rodando o tempo todo na sala e cuida de:
   1) dados: quando alguém rola, abre a camada transparente (overlay.html) onde os dados caem para todos;
   2) mesa: publica o resumo da ficha de quem entrou na mesa (e os NPCs que o mestre mostrou);
   3) recebe as edições que o mestre faz na ficha do jogador. */
import {loadOBR,ready} from "./obr.js?v=2.14.0";
import {VER,KEY,KEY_NPC,KEY_NIMG,KEY_IMG,KEY_Z,LS,store,makePublisher,sigNpcs,sigNpcImgs,buildNpcs,buildNpcImgs,unpack} from "./mesa-lib.js?v=2.14.0";
import {K_G,K_P,normG,normP,escLocal} from "./esconder-lib.js?v=2.14.0";
import {K_C,K_CP,normC,normCP} from "./alcancar-lib.js?v=2.14.0";
import {K_B,K_BP,normB,normBP,occupant,RESET as BRESET} from "./equilibrio-lib.js?v=2.14.0";
import {makeState,pickGm} from "./estado.js?v=2.14.0";
(async()=>{
  /* o SDK pode falhar ao carregar (internet instável quando o jogador entra): tenta de novo até conseguir, em vez de ficar morto até o F5 */
  let OBR=null;
  for(let n=0;;n++){
    const o=await loadOBR();
    if(o){if(!(await ready(o)))return;OBR=o;break}       // carregou mas não está dentro do Owlbear: nada a fazer
    console.warn("[ficha] sem conexão com o SDK, tentando de novo…");
    await new Promise(r=>setTimeout(r,Math.min(20000,2000*(n+1))));
  }
  addEventListener("unhandledrejection",e=>{console.warn("[ficha] erro solto",e.reason);e.preventDefault()});
  const abs=p=>new URL(p,location.href).href;
  const ST=makeState(OBR);                              // estado do mestre (Esconder/Escalada/Balança) nos metadados da SALA
  if(window.DICE){DICE.useOBR(OBR);DICE.publish(false)}   // republica o estilo dos dados deste jogador ao entrar na sala

  /* ===== dados + cartões na tela (a mesma camada transparente faz as duas coisas) ===== */
  const CH=ENG.CH;
  let seq=0,open=false,mid="",lastAct=0,helloT=0,hello=false,arrange=false,lastTry=0;
  const log=[];
  const hudOn=()=>store.get("hud-on")!=="0";
const trayOn=()=>store.get("tray-always")==="1";      // setting "mesa de dados sempre visível"
const warmOn=()=>store.get("warm")!=="0";             // camada dos dados já aberta e pronta (rolagem aparece na hora); padrão: ligado
let escRemote=false,amGM=false,myId="";               // Esconder: o mestre mostrou o painel para todos / eu sou o mestre
let clRemote=false,clShown=0;                         // Equilíbrio > Alcançar: o mestre ativou uma escalada / id da escalada cuja janela já foi aberta
let balLocal=false;                                    // Equilíbrio > Equilibrar: tenho a janela da balança (mestre com balança ativa, ou o jogador que está nela)
const keepOn=()=>warmOn()||hudOn()||trayOn()||escLocal()||escRemote||clRemote||balLocal;   // a camada dos dados fica aberta durante a escalada (os testes rolam nela)
  const feed=e=>OBR.broadcast.sendMessage(CH.feed,e,{destination:"LOCAL"}).catch(()=>{});
  async function openOverlay(e,tries=0){
    const id="ordem.ficha/overlay/"+Date.now();
    open=true;hello=false;mid=id;lastAct=Date.now();lastTry=Date.now();
    const q="?v=2.14.0&mid="+encodeURIComponent(id)+"&hud="+(hudOn()?1:0)+"&tray="+(trayOn()?1:0)+"&warm="+(warmOn()?1:0)+"&esc="+((escLocal()||escRemote)?1:0)+"&cl="+((clRemote||balLocal)?1:0)+"&arr="+(arrange?1:0)+"&s="+(e?e.seq:seq)+(e?"&p="+ENG.b64(e.p):"");
    try{
      await OBR.modal.open({id,url:abs("overlay.html")+q,
        fullScreen:true,hidePaper:true,hideBackdrop:true,disablePointerEvents:!arrange});
    }catch(err){if(mid===id)open=false;console.warn("[ficha] não consegui abrir a camada de dados",err);return}
    /* se a camada não der sinal de vida em 12 s (não carregou: CDN lenta), fecha e tenta de novo (até 3 vezes) */
    clearTimeout(helloT);
    helloT=setTimeout(()=>{
      if(mid!==id||!open||hello)return;
      OBR.modal.close(id).catch(()=>{});open=false;
      if(tries<2)setTimeout(()=>{if(!open&&(e||keepOn()))openOverlay(e,tries+1)},600*(tries+1));
    },12000);
  }
  /* zonas de arrastar: um popover transparente do tamanho de cada foto (a camada dos cartões não recebe cliques) */
  const grabs=new Map(),gid=id=>"ordem.hud/grab/"+id;
  async function openGrab(r){
    const pid=gid(r.id),g={...r,alive:Date.now(),tried:Date.now()};grabs.set(r.id,g);
    try{await OBR.popover.close(pid)}catch(e){}
    try{
      await OBR.popover.open({id:pid,url:abs(r.id==="quick"||r.id==="dicecfg"?"quick.html":"grab.html")+"?v="+VER+"&id="+encodeURIComponent(r.id)+(r.id==="quick"?"&mode=icon":r.id==="dicecfg"?"&mode=cfg":""),width:r.w,height:r.h,
        anchorReference:"POSITION",anchorPosition:{left:r.x,top:r.y},
        anchorOrigin:{horizontal:"LEFT",vertical:"TOP"},transformOrigin:{horizontal:"LEFT",vertical:"TOP"},
        hidePaper:true,disableClickAway:true,marginThreshold:0});
    }catch(e){console.warn("[hud] não consegui abrir a zona de arrastar",e)}
  }
  function syncGrabs(list){
    const ok=r=>r&&typeof r.id==="string"&&[r.x,r.y,r.w,r.h].every(Number.isFinite)&&r.w>=20&&r.w<=900&&r.h>=20&&r.h<=900;
    const rects=(Array.isArray(list)?list:[]).filter(ok).slice(0,16),want=new Set(rects.map(r=>r.id));
    for(const [id] of grabs)if(!want.has(id)){OBR.popover.close(gid(id)).catch(()=>{});grabs.delete(id)}
    for(const r of rects){const g=grabs.get(r.id);if(g&&g.x===r.x&&g.y===r.y&&g.w===r.w&&g.h===r.h)continue;openGrab(r)}
  }
  /* clicou no dadinho: abre a caixa de digitar ao lado dele (para o lado com espaço) */
  OBR.broadcast.onMessage("ordem.hud/quick",async()=>{
    const g=grabs.get("quick");if(!g)return;
    let vw=1280;try{vw=await OBR.viewport.getWidth()}catch(e){}
    const W=260,H=44,left=g.x-W-6>=4?g.x-W-6:Math.min(vw-W-4,g.x+g.w+6),top=Math.max(4,g.y+Math.round(g.h/2-H/2)),pid="ordem.hud/quickin";
    try{await OBR.popover.close(pid)}catch(e){}
    try{await OBR.popover.open({id:pid,url:abs("quick.html")+"?v="+VER+"&mode=in&pop="+encodeURIComponent(pid),width:W,height:H,
      anchorReference:"POSITION",anchorPosition:{left,top},anchorOrigin:{horizontal:"LEFT",vertical:"TOP"},transformOrigin:{horizontal:"LEFT",vertical:"TOP"},
      hidePaper:true,disableClickAway:false,marginThreshold:0})}catch(e){console.warn("[hud] não consegui abrir a caixa de rolagem",e)}
  });
  /* clicou no botão de personalizar: abre o painel ao lado dele */
  OBR.broadcast.onMessage("ordem.hud/dicecfg",async()=>{
    const g=grabs.get("dicecfg")||grabs.get("quick");if(!g)return;
    let vw=1280,vh=800;try{vw=await OBR.viewport.getWidth();vh=await OBR.viewport.getHeight()}catch(e){}
    const W=Math.min(440,vw-16),H=Math.min(700,vh-16),left=g.x-W-8>=4?g.x-W-8:Math.min(vw-W-4,g.x+g.w+8),top=Math.max(8,Math.min(vh-H-8,g.y-Math.round(H/2))),pid="ordem.hud/dadoscfg";
    try{await OBR.popover.close(pid)}catch(e){}
    try{await OBR.popover.open({id:pid,url:abs("dados.html")+"?v="+VER+"&pop="+encodeURIComponent(pid),width:W,height:H,
      anchorReference:"POSITION",anchorPosition:{left,top},anchorOrigin:{horizontal:"LEFT",vertical:"TOP"},transformOrigin:{horizontal:"LEFT",vertical:"TOP"},
      hidePaper:true,disableClickAway:false,marginThreshold:0})}catch(e){console.warn("[hud] não consegui abrir o painel de dados",e)}
  });
  OBR.broadcast.onMessage("ordem.hud/layout",ev=>{if(open&&!arrange)syncGrabs((ev.data||{}).rects)});   // fotos dos cartões e a mesa de dados
  OBR.broadcast.onMessage("ordem.hud/alive",ev=>{const g=grabs.get(String((ev.data||{}).id));if(g)g.alive=Date.now()});
  /* a camada parou de responder: FECHA a velha antes de abrir outra (antes ficavam duas abertas e cada rolagem caía duas vezes) */
  function dropStale(){if(open&&Date.now()-lastAct>45000){const old=mid;open=false;syncGrabs([]);OBR.modal.close(old).catch(()=>{})}}
  const ensure=()=>{if(!open&&keepOn())openOverlay(null)};
  async function closeOverlay(){const id=mid;open=false;syncGrabs([]);try{await OBR.modal.close(id)}catch(e){}}
  async function cfg(){                         // ligou/desligou os cartões na tela ou a mesa sempre visível
    if(!keepOn()){arrange=false;if(open)await closeOverlay();return}
    if(open)await closeOverlay();ensure();      // reabre com a configuração nova
  }
  /* um minijogo ligou/desligou: NÃO fecha e reabre a camada dos dados (antes fazia isso, e se a reabertura falhasse o painel sumia até o F5).
     Só garante que ela está aberta e avisa a camada em tempo real se deve ficar aberta. */
  function keepSync(){
    if(keepOn()){
      if(!open)ensure();
      else OBR.broadcast.sendMessage("ordem.hud/keep",{on:true,mid},{destination:"LOCAL"}).catch(()=>{});
    }else if(open){
      OBR.broadcast.sendMessage("ordem.hud/keep",{on:false,mid},{destination:"LOCAL"}).catch(()=>{});
    }
  }
  async function setArrange(on){
    arrange=!!on&&keepOn();
    if(open)await closeOverlay();
    if(keepOn())openOverlay(null);
  }
  OBR.broadcast.onMessage(CH.roll,ev=>{
    const p=ENG.clean(ev.data);if(!p)return;
    if(p.hid&&amGM&&String(p.pid)!==myId)return;      // dados de esconderijo: o mestre não os vê
    /* rolagem que ficou presa (aba em segundo plano, internet caindo) e chegou tarde: não anima mais, senão os dados "velhos" caem de repente */
    const age=ENG.age(p.pid,p.t);
    if(age>60000){console.info("[dados] rolagem muito antiga ignorada ("+Math.round(age/1000)+" s)");return}
    if(age>ENG.MAX_AGE)p.anim=false;                   // chegou tarde: mostra só o resultado, sem os dados caírem de repente
    if(ENG.seen(p))return;                            // a mesma rolagem chegando duas vezes
    p.ds=window.DICE?DICE.clean(ev.data&&ev.data.ds):null;
    dropStale();
    const e={seq:++seq,p,at:Date.now()};log.push(e);while(log.length>12)log.shift();
    lastAct=Date.now();
    if(open)feed(e);else openOverlay(e);
  });
  OBR.broadcast.onMessage(CH.idle,ev=>{
    const d=ev.data||{},seen=+d.seen||0;
    if(d.mid&&d.mid!==mid)return;                 // recado de uma camada antiga: não pode fechar a nova
    hello=true;clearTimeout(helloT);lastAct=Date.now();
    const missing=log.filter(e=>e.seq>seen&&Date.now()-e.at<8000);   // só as recentes: nunca "reanima" rolagem velha
    if(missing.length){missing.forEach(feed);return}
    if(d.idle&&open&&!keepOn()){open=false;syncGrabs([]);OBR.modal.close(mid).catch(()=>{})}
  });
  OBR.broadcast.onMessage("ordem.hud/cfg",()=>cfg());
  OBR.broadcast.onMessage("ordem.hud/arrange",ev=>setArrange(!!(ev.data&&ev.data.on)));
  addEventListener("storage",ev=>{if(ev.key==="hud-on"||ev.key==="tray-always"||ev.key==="esc-on"||ev.key==="warm")cfg()});
  /* garantia: se a camada parou de responder, reabre (no máximo uma vez a cada 20 s) */
  setInterval(()=>{
    if(!keepOn())return;
    dropStale();
    if(!open&&Date.now()-lastTry>20000)ensure();
    if(clShown&&store.get("cl-closed")!==String(clShown)&&Date.now()-clAlive>30000&&Date.now()-clTry>30000)openCl();
    if(balKey&&store.get("bal-closed")!==balKey&&Date.now()-balAlive>30000&&Date.now()-balTry>30000)openBal();   // a janela da balança não deu sinal: reabre   // a janela da escalada não deu sinal: reabre
    for(const [,g] of grabs)if(Date.now()-g.alive>20000&&Date.now()-g.tried>20000)openGrab(g);   // a zona sumiu (ex.: outra janela fechou): reabre
  },5000);

  /* ===== mesa: publicar a minha ficha na sala (só se eu entrei) =====
     3 partes independentes (ver mesa-lib.js): o essencial (nome/PV/PD) sai em ~150 ms; foto e ficha completa só quando mudam. */
  let isGM=false;try{isGM=(await OBR.player.getRole())==="GM"}catch(e){}
  const pub=makePublisher(OBR);
  let lastN=null,lastNI=null,busy=false,again=false,againForce=false,timer=0,zT=0;
  const meta=async()=>{try{return await OBR.player.getMetadata()}catch(e){return{}}};
  async function pubMine(force){
    const j=store.get(LS.joined);
    if(j==="0"){const m=await meta();if(m&&m[KEY]){await pub.remove()}return}
    if(j!=="1")return;      // não sei (ou este navegador não divide o armazenamento com a janela da mesa): não mexo no que ela publicou
    await pub.lite(force);
    pub.img(false).catch(e=>console.warn("[mesa] foto",e));
    clearTimeout(zT);zT=setTimeout(()=>pub.z(false).catch(e=>console.warn("[mesa] ficha completa",e)),force?250:2500);
  }
  async function pubNpcs(force){            // só o mestre publica NPCs, e só os que ele mostrou
    if(!isGM)return;
    const sg=sigNpcs();
    if(force||sg!==lastN){
      lastN=sg;const a=buildNpcs();
      await OBR.player.setMetadata({[KEY_NPC]:a.length?a:undefined,...(a.length?{}:{[KEY_NIMG]:undefined})});
    }
    const si=sigNpcImgs();
    if(force||si!==lastNI){
      lastNI=si;const o=await buildNpcImgs();
      await OBR.player.setMetadata({[KEY_NIMG]:Object.keys(o).length?o:undefined});
    }
  }
  async function publish(force){
    if(busy){again=true;againForce=againForce||!!force;return}
    busy=true;
    try{await pubMine(force)}catch(e){console.warn("[mesa] não consegui publicar a ficha",e)}
    try{await pubNpcs(force)}catch(e){console.warn("[mesa] não consegui publicar os NPCs",e);lastN=null;lastNI=null}
    busy=false;if(again){const f=againForce;again=false;againForce=false;publish(f)}
  }
  const soon=force=>{clearTimeout(timer);timer=setTimeout(()=>publish(force),force?0:120)};
  addEventListener("storage",ev=>{if(!ev.key||ev.key===LS.sheet||ev.key===LS.img||ev.key===LS.joined||ev.key.startsWith("npc:")||ev.key==="mesa-npcs")soon(false)});   // a ficha (outra janela, mesmo domínio) salvou algo
  setInterval(()=>publish(false),8000);                   // garantia (só manda se algo mudou)
  OBR.broadcast.onMessage("ordem.mesa/nudge",()=>soon(false));
  /* o mestre editou a minha ficha: só aceita se quem mandou for mesmo o mestre */
  OBR.broadcast.onMessage("ordem.mesa/edit",async ev=>{
    try{
      const d=ev.data||{};if(d.to!==OBR.player.id)return;
      const from=((await OBR.party.getPlayers()).find(p=>p.connectionId===ev.connectionId));
      if(!from||from.role!=="GM")return;
      const sheet=await unpack(d.z);JSON.parse(sheet);
      store.set(LS.sheet,sheet);soon(false);
    }catch(e){console.warn("[mesa] edição do mestre ignorada",e)}
  });
  publish(true);
  ensure();

  /* ===== Esconder: painel remoto (ligado pelo mestre) e descarte automático dos dados chamados ===== */
  amGM=isGM;myId=String(OBR.player.id||"");
  const LSCT="esc-ct";let timerD=0;
  /* cópia local dos jogadores e dos meus metadados: vem dos próprios eventos do Owlbear (sem pedir tudo de novo a cada mudança) */
  let cParty=[],cMeta={};
  try{cMeta=(await OBR.player.getMetadata())||{};cParty=await OBR.party.getPlayers()}catch(e){}
  async function readEsc(){
    const ps=cParty;
    const me={id:OBR.player.id,role:isGM?"GM":"PLAYER",metadata:cMeta};
    const gm=[me,...ps].find(p=>p.role==="GM"),g=normG(pickGm(ST,gm,K_G));
    if(g.on!==escRemote){escRemote=g.on;keepSync()}
    clSync(gm);
    balSync(gm,[me,...ps]);
    if(isGM)return;
    if(store.get(LSCT)==null)store.set(LSCT,String(g.ct));        // primeira leitura: não reaplica chamadas antigas
    if(g.ct>(+store.get(LSCT)||0)){
      store.set(LSCT,String(g.ct));
      if(g.ap&&g.calls.length)setTimeout(async()=>{                   // dá tempo de todo mundo ver o número revelado
        try{
          const m=cMeta,pp=normP(m&&m[K_P]);
          const keep=pp.dice.filter(x=>!g.calls.includes(x.v));
          if(keep.length!==pp.dice.length)await OBR.player.setMetadata({[K_P]:{...pp,dice:keep,note:{k:"found",t:Date.now()}}});
        }catch(e){console.warn("[esconder] descarte falhou",e)}
      },6000);
    }
  }
  /* ===== Equilíbrio > Alcançar: a janela da escalada abre sozinha para todos quando o mestre ativa ===== */
  const CLW="ordem.cl/win";
  let clAlive=0,clTry=0;
  /* posição absoluta (canto de cima-esquerda) em "cl-xy"; sem ela, usa o canto escolhido em "cl-pos". Arrastar muda "cl-xy". */
  let clBusy=false,clAgain=false,vpc=null;
  /* tamanho da tela do Owlbear em cache (pedir a cada movimento do mouse era o que deixava o arrastar das janelas "pesado") */
  async function viewport(){
    if(vpc&&Date.now()-vpc.t<3000)return vpc;
    let vw=1280,vh=800;try{vw=await OBR.viewport.getWidth();vh=await OBR.viewport.getHeight()}catch(e){}
    return vpc={vw,vh,t:Date.now()};
  }
  async function openCl(fresh=true){
    if(clBusy){clAgain=true;return}                // já tem uma chamada em andamento: só guarda que precisa repetir com a posição mais nova
    clBusy=true;
    try{await openClNow(fresh)}finally{clBusy=false;if(clAgain){clAgain=false;openCl(false)}}
  }
  async function openClNow(fresh){
    const {vw,vh}=await viewport();
    const sc=Math.min(1.7,Math.max(.7,parseFloat(store.get("cl-scale"))||1)),pos=(+store.get("cl-pos")||0)%4;   // 0 baixo-direita, 1 baixo-esquerda, 2 cima-esquerda, 3 cima-direita
    const mn=store.get("cl-min")==="1";                                                                       // minimizada: só o cabeçalho
    const W=Math.round(Math.min(vw-16,360*sc)),H=mn?Math.round(46*sc):Math.round(Math.min(vh-16,580*sc));
    let xy=null;try{xy=JSON.parse(store.get("cl-xy")||"null")}catch(e){}
    if(!xy||!Number.isFinite(xy.x)||!Number.isFinite(xy.y))xy={x:(pos===1||pos===2)?12:vw-12-W,y:(pos===2||pos===3)?12:vh-12-H};
    xy={x:Math.round(Math.max(0,Math.min(vw-W,xy.x))),y:Math.round(Math.max(0,Math.min(vh-H,xy.y)))};
    store.set("cl-xy",JSON.stringify(xy));clTry=Date.now();
    if(fresh)try{await OBR.popover.close(CLW)}catch(e){}
    try{await OBR.popover.open({id:CLW,url:abs("alcancar.html")+"?v="+VER+"&pop="+encodeURIComponent(CLW),width:W,height:H,
      anchorReference:"POSITION",anchorPosition:{left:xy.x,top:xy.y},
      anchorOrigin:{horizontal:"LEFT",vertical:"TOP"},transformOrigin:{horizontal:"LEFT",vertical:"TOP"},hidePaper:true,disableClickAway:true,marginThreshold:0});
    }catch(e){console.warn("[alcançar] não consegui abrir a janela",e)}
  }
  const closeCl=()=>OBR.popover.close(CLW).catch(()=>{});
  function clSync(gm){                         // chamada a cada leitura do estado do mestre
    const g=normC(pickGm(ST,gm,K_C));
    if(g.on!==clRemote){clRemote=g.on;keepSync()}
    if(g.on){if(clShown!==g.id){clShown=g.id;if(store.get("cl-closed")!==String(g.id))openCl()}}
    else if(clShown){clShown=0;closeCl()}
  }
  OBR.broadcast.onMessage("ordem.cl/place",()=>{if(clShown)openCl(false)});
  OBR.broadcast.onMessage("ordem.cl/move",()=>{if(clShown)openCl(false)});                 // arrastando: atualiza a posição sem fechar
  OBR.broadcast.onMessage("ordem.cl/alive",()=>{clAlive=Date.now()});                     // mudou tamanho ou canto
  OBR.broadcast.onMessage("ordem.cl/close",()=>{if(clShown)store.set("cl-closed",String(clShown));closeCl()});
  OBR.broadcast.onMessage("ordem.cl/show",()=>{if(!clShown)return;store.set("cl-closed",null);openCl()});
  /* o mestre derrubou este jogador da parede: só vale se quem mandou for mesmo o mestre */
  OBR.broadcast.onMessage("ordem.cl/drop",async ev=>{
    try{
      const d=ev.data||{};if(String(d.to)!==myId||isGM)return;
      const from=(await OBR.party.getPlayers()).find(p=>p.connectionId===ev.connectionId);
      if(!from||from.role!=="GM")return;
      const m=await OBR.player.getMetadata(),cp=normCP(m&&m[K_CP]);
      if(!cp.in)return;
      await OBR.player.setMetadata({[K_CP]:{...cp,in:0,p:0,top:0,fell:1}});
    }catch(e){console.warn("[alcançar] queda ignorada",e)}
  });
  /* ===== Equilíbrio > Equilibrar: só o mestre e o jogador que está na balança recebem a janela (nunca os outros) ===== */
  const BW="ordem.bal/win";
  let balKey="",balAlive=0,balTry=0;
  let balBusy=false,balAgain=false;
  async function openBal(fresh=true){
    if(balBusy){balAgain=true;return}
    balBusy=true;
    try{await openBalNow(fresh)}finally{balBusy=false;if(balAgain){balAgain=false;openBal(false)}}
  }
  async function openBalNow(fresh){
    const {vw,vh}=await viewport();
    const sc=Math.min(1.7,Math.max(.7,parseFloat(store.get("bal-scale"))||1)),mn=store.get("bal-min")==="1";
    const W=Math.round(Math.min(vw-16,440*sc)),H=mn?Math.round(46*sc):Math.round(Math.min(vh-16,640*sc));
    let xy=null;try{xy=JSON.parse(store.get("bal-xy")||"null")}catch(e){}
    if(!xy||!Number.isFinite(xy.x)||!Number.isFinite(xy.y))xy={x:Math.round((vw-W)/2),y:Math.round((vh-H)/2)};
    xy={x:Math.round(Math.max(0,Math.min(vw-W,xy.x))),y:Math.round(Math.max(0,Math.min(vh-H,xy.y)))};
    store.set("bal-xy",JSON.stringify(xy));balTry=Date.now();
    if(fresh)try{await OBR.popover.close(BW)}catch(e){}
    try{await OBR.popover.open({id:BW,url:abs("balanca.html")+"?v="+VER+"&pop="+encodeURIComponent(BW),width:W,height:H,
      anchorReference:"POSITION",anchorPosition:{left:xy.x,top:xy.y},
      anchorOrigin:{horizontal:"LEFT",vertical:"TOP"},transformOrigin:{horizontal:"LEFT",vertical:"TOP"},hidePaper:true,disableClickAway:true,marginThreshold:0});
    }catch(e){console.warn("[balança] não consegui abrir a janela",e)}
  }
  const closeBal=()=>OBR.popover.close(BW).catch(()=>{});
  function balSync(gm,all){                      // chamada a cada leitura do estado da sala
    const g=normB(pickGm(ST,gm,K_B)),players=all.filter(p=>p&&p.role!=="GM");
    const occ=g.on?occupant(g,all):null,me=all.find(p=>String(p.id)===myId),mine=normBP(me&&me.metadata&&me.metadata[K_BP]);
    /* dois subiram ao mesmo tempo: fica quem subiu primeiro, o outro é tirado */
    if(!isGM&&g.on&&mine.in&&mine.id===g.id&&occ&&String(occ.p.id)!==myId)OBR.player.setMetadata({[K_BP]:{...mine,in:0,...BRESET}}).catch(()=>{});
    let key="";
    if(g.on){if(isGM)key="g"+g.id;else if(occ&&String(occ.p.id)===myId)key="p"+g.id+":"+mine.t}
    if((key!=="")!==balLocal){balLocal=key!=="";keepSync()}
    if(key!==balKey){
      balKey=key;
      if(key){if(store.get("bal-closed")!==key)openBal()}else closeBal();
    }
  }
  OBR.broadcast.onMessage("ordem.bal/place",()=>{if(balKey)openBal(false)});
  OBR.broadcast.onMessage("ordem.bal/move",()=>{if(balKey)openBal(false)});
  OBR.broadcast.onMessage("ordem.bal/alive",()=>{balAlive=Date.now()});
  OBR.broadcast.onMessage("ordem.bal/close",()=>{if(balKey)store.set("bal-closed",balKey);closeBal()});
  OBR.broadcast.onMessage("ordem.bal/show",()=>{if(!balKey)return;store.set("bal-closed",null);openBal()});
  /* o mestre expulsou este jogador da balança: só vale se quem mandou for mesmo o mestre */
  OBR.broadcast.onMessage("ordem.bal/kick",async ev=>{
    try{
      const d=ev.data||{};if(String(d.to)!==myId||isGM)return;
      const from=(await OBR.party.getPlayers()).find(p=>p.connectionId===ev.connectionId);
      if(!from||from.role!=="GM")return;
      const m=await OBR.player.getMetadata(),bp=normBP(m&&m[K_BP]);
      if(!bp.in)return;
      await OBR.player.setMetadata({[K_BP]:{...bp,in:0,...BRESET}});
    }catch(e){console.warn("[balança] expulsão ignorada",e)}
  });
  /* alguém me deu um dado de esconderijo (Distrair / Chamar atenção) */
  OBR.broadcast.onMessage("ordem.esc/give",async ev=>{
    try{
      const d=ev.data||{};if(String(d.to)!==myId||isGM)return;
      const m=await OBR.player.getMetadata(),pp=normP(m&&m[K_P]),f=+d.f,v=+d.v;
      if(!(f>=4&&f<=20&&v>=1&&v<=f))return;
      if(pp.dice.length>=8)return;
      await OBR.player.setMetadata({[K_P]:{...pp,h:1,dice:[...pp.dice,{f,v,n:String(d.n||"Presente").slice(0,24),id:Math.random().toString(36).slice(2,8)}]}});
    }catch(e){console.warn("[esconder] dado recebido falhou",e)}
  });
  let reT=0;const readSoon=()=>{clearTimeout(reT);reT=setTimeout(readEsc,100)};   // junta várias mudanças seguidas numa leitura só
  try{OBR.party.onChange(ps=>{cParty=ps;readSoon()});OBR.player.onChange(p=>{cMeta=p.metadata||{};readSoon()})}catch(e){}
  ST.subs.add(()=>readSoon());await ST.load();      // o estado do mestre veio da sala: qualquer mudança dele reaplica na hora
  readEsc();
  setInterval(async()=>{try{cMeta=(await OBR.player.getMetadata())||{};cParty=await OBR.party.getPlayers()}catch(e){}readEsc()},15000);   // garantia
})();
</script>
