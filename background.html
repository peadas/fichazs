<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Ficha Ordem (segundo plano)</title></head>
<body>
<script src="engine.js?v=2.10.2"></script>
<script src="dice-style.js?v=2.10.2"></script>
<script type="module">
/* Fica rodando o tempo todo na sala e cuida de:
   1) dados: quando alguém rola, abre a camada transparente (overlay.html) onde os dados caem para todos;
   2) mesa: publica o resumo da ficha de quem entrou na mesa (e os NPCs que o mestre mostrou);
   3) recebe as edições que o mestre faz na ficha do jogador. */
import {loadOBR,ready} from "./obr.js?v=2.10.2";
import {VER,KEY,KEY_NPC,LS,store,sig,buildEntry,sigNpcs,buildNpcs,unpack} from "./mesa-lib.js?v=2.10.2";
import {K_G,K_P,normG,normP,escLocal} from "./esconder-lib.js?v=2.10.2";
(async()=>{
  const OBR=await loadOBR();
  if(!OBR||!(await ready(OBR)))return;
  const abs=p=>new URL(p,location.href).href;
  if(window.DICE){DICE.useOBR(OBR);DICE.publish(false)}   // republica o estilo dos dados deste jogador ao entrar na sala

  /* ===== dados + cartões na tela (a mesma camada transparente faz as duas coisas) ===== */
  const CH=ENG.CH;
  let seq=0,open=false,mid="",lastAct=0,helloT=0,hello=false,arrange=false,lastTry=0;
  const log=[];
  const hudOn=()=>store.get("hud-on")!=="0";
const trayOn=()=>store.get("tray-always")==="1";      // setting "mesa de dados sempre visível"
let escRemote=false,amGM=false,myId="";               // Esconder: o mestre mostrou o painel para todos / eu sou o mestre
const keepOn=()=>hudOn()||trayOn()||escLocal()||escRemote;
  const feed=e=>OBR.broadcast.sendMessage(CH.feed,e,{destination:"LOCAL"}).catch(()=>{});
  async function openOverlay(e){
    const id="ordem.ficha/overlay/"+Date.now();
    open=true;hello=false;mid=id;lastAct=Date.now();lastTry=Date.now();
    const q="?v=2.10.2&mid="+encodeURIComponent(id)+"&hud="+(hudOn()?1:0)+"&tray="+(trayOn()?1:0)+"&esc="+((escLocal()||escRemote)?1:0)+"&arr="+(arrange?1:0)+"&s="+(e?e.seq:seq)+(e?"&p="+ENG.b64(e.p):"");
    try{
      await OBR.modal.open({id,url:abs("overlay.html")+q,
        fullScreen:true,hidePaper:true,hideBackdrop:true,disablePointerEvents:!arrange});
    }catch(err){if(mid===id)open=false;console.warn("[ficha] não consegui abrir a camada de dados",err);return}
    /* se a camada não der sinal de vida em 6 s (não carregou), fecha e tenta de novo uma vez */
    clearTimeout(helloT);
    helloT=setTimeout(()=>{
      if(mid!==id||!open||hello)return;
      OBR.modal.close(id).catch(()=>{});open=false;
      if(e&&!e.retry)openOverlay({...e,retry:1});
    },6000);
  }
  /* zonas de arrastar: um popover transparente do tamanho de cada foto (a camada dos cartões não recebe cliques) */
  const grabs=new Map(),gid=id=>"ordem.hud/grab/"+id;
  async function openGrab(r){
    const pid=gid(r.id),g={...r,alive:Date.now(),tried:Date.now()};grabs.set(r.id,g);
    try{await OBR.popover.close(pid)}catch(e){}
    try{
      await OBR.popover.open({id:pid,url:abs(r.id==="quick"||r.id==="dicecfg"?"quick.html":"grab.html")+"?v="+VER+"&id="+encodeURIComponent(r.id)+(r.id==="quick"?"&mode=icon":r.id==="dicecfg"?"&mode=cfg":""),width:r.w,height:r.h,
        anchorReference:"POSITION",anchorPosition:{left:r.x,top:r.y},
        anchorOrigin:{horizontal:"LEFT",vertical:"TOP"},transformOrigin:{horizontal:"LEFT",vertical:"TOP"},
        hidePaper:true,disableClickAway:true,marginThreshold:0});
    }catch(e){console.warn("[hud] não consegui abrir a zona de arrastar",e)}
  }
  function syncGrabs(list){
    const ok=r=>r&&typeof r.id==="string"&&[r.x,r.y,r.w,r.h].every(Number.isFinite)&&r.w>=20&&r.w<=900&&r.h>=20&&r.h<=900;
    const rects=(Array.isArray(list)?list:[]).filter(ok).slice(0,16),want=new Set(rects.map(r=>r.id));
    for(const [id] of grabs)if(!want.has(id)){OBR.popover.close(gid(id)).catch(()=>{});grabs.delete(id)}
    for(const r of rects){const g=grabs.get(r.id);if(g&&g.x===r.x&&g.y===r.y&&g.w===r.w&&g.h===r.h)continue;openGrab(r)}
  }
  /* clicou no dadinho: abre a caixa de digitar ao lado dele (para o lado com espaço) */
  OBR.broadcast.onMessage("ordem.hud/quick",async()=>{
    const g=grabs.get("quick");if(!g)return;
    let vw=1280;try{vw=await OBR.viewport.getWidth()}catch(e){}
    const W=260,H=44,left=g.x-W-6>=4?g.x-W-6:Math.min(vw-W-4,g.x+g.w+6),top=Math.max(4,g.y+Math.round(g.h/2-H/2)),pid="ordem.hud/quickin";
    try{await OBR.popover.close(pid)}catch(e){}
    try{await OBR.popover.open({id:pid,url:abs("quick.html")+"?v="+VER+"&mode=in&pop="+encodeURIComponent(pid),width:W,height:H,
      anchorReference:"POSITION",anchorPosition:{left,top},anchorOrigin:{horizontal:"LEFT",vertical:"TOP"},transformOrigin:{horizontal:"LEFT",vertical:"TOP"},
      hidePaper:true,disableClickAway:false,marginThreshold:0})}catch(e){console.warn("[hud] não consegui abrir a caixa de rolagem",e)}
  });
  /* clicou no botão de personalizar: abre o painel ao lado dele */
  OBR.broadcast.onMessage("ordem.hud/dicecfg",async()=>{
    const g=grabs.get("dicecfg")||grabs.get("quick");if(!g)return;
    let vw=1280,vh=800;try{vw=await OBR.viewport.getWidth();vh=await OBR.viewport.getHeight()}catch(e){}
    const W=Math.min(440,vw-16),H=Math.min(700,vh-16),left=g.x-W-8>=4?g.x-W-8:Math.min(vw-W-4,g.x+g.w+8),top=Math.max(8,Math.min(vh-H-8,g.y-Math.round(H/2))),pid="ordem.hud/dadoscfg";
    try{await OBR.popover.close(pid)}catch(e){}
    try{await OBR.popover.open({id:pid,url:abs("dados.html")+"?v="+VER+"&pop="+encodeURIComponent(pid),width:W,height:H,
      anchorReference:"POSITION",anchorPosition:{left,top},anchorOrigin:{horizontal:"LEFT",vertical:"TOP"},transformOrigin:{horizontal:"LEFT",vertical:"TOP"},
      hidePaper:true,disableClickAway:false,marginThreshold:0})}catch(e){console.warn("[hud] não consegui abrir o painel de dados",e)}
  });
  OBR.broadcast.onMessage("ordem.hud/layout",ev=>{if(open&&!arrange)syncGrabs((ev.data||{}).rects)});   // fotos dos cartões e a mesa de dados
  OBR.broadcast.onMessage("ordem.hud/alive",ev=>{const g=grabs.get(String((ev.data||{}).id));if(g)g.alive=Date.now()});
  const ensure=()=>{if(!open&&keepOn())openOverlay(null)};
  async function closeOverlay(){const id=mid;open=false;syncGrabs([]);try{await OBR.modal.close(id)}catch(e){}}
  async function cfg(){                         // ligou/desligou os cartões na tela ou a mesa sempre visível
    if(!keepOn()){arrange=false;if(open)await closeOverlay();return}
    if(open)await closeOverlay();ensure();      // reabre com a configuração nova
  }
  async function setArrange(on){
    arrange=!!on&&keepOn();
    if(open)await closeOverlay();
    if(keepOn())openOverlay(null);
  }
  OBR.broadcast.onMessage(CH.roll,ev=>{
    const p=ENG.clean(ev.data);if(!p)return;
    if(p.hid&&amGM&&String(p.pid)!==myId)return;      // dados de esconderijo: o mestre não os vê
    p.ds=window.DICE?DICE.clean(ev.data&&ev.data.ds):null;
    if(open&&Date.now()-lastAct>45000)open=false;
    const e={seq:++seq,p};log.push(e);while(log.length>20)log.shift();
    lastAct=Date.now();
    if(open)feed(e);else openOverlay(e);
  });
  OBR.broadcast.onMessage(CH.idle,ev=>{
    const d=ev.data||{},seen=+d.seen||0;
    if(d.mid&&d.mid!==mid)return;                 // recado de uma camada antiga: não pode fechar a nova
    hello=true;clearTimeout(helloT);lastAct=Date.now();
    const missing=log.filter(e=>e.seq>seen);
    if(missing.length){missing.forEach(feed);return}
    if(d.idle&&open&&!keepOn()){open=false;syncGrabs([]);OBR.modal.close(mid).catch(()=>{})}
  });
  OBR.broadcast.onMessage("ordem.hud/cfg",()=>cfg());
  OBR.broadcast.onMessage("ordem.hud/arrange",ev=>setArrange(!!(ev.data&&ev.data.on)));
  addEventListener("storage",ev=>{if(ev.key==="hud-on"||ev.key==="tray-always"||ev.key==="esc-on")cfg()});
  /* garantia: se a camada parou de responder, reabre (no máximo uma vez a cada 20 s) */
  setInterval(()=>{
    if(!keepOn())return;
    if(open&&Date.now()-lastAct>45000)open=false;
    if(!open&&Date.now()-lastTry>20000)ensure();
    for(const [,g] of grabs)if(Date.now()-g.alive>20000&&Date.now()-g.tried>20000)openGrab(g);   // a zona sumiu (ex.: outra janela fechou): reabre
  },5000);

  /* ===== mesa: publicar a minha ficha na sala (só se eu entrei) ===== */
  let isGM=false;try{isGM=(await OBR.player.getRole())==="GM"}catch(e){}
  let last="",lastN=null,busy=false,again=false,timer=0;
  async function pubMine(force){
    const sg=sig();if(!force&&sg===last)return;
    last=sg;
    const j=store.get(LS.joined);
    if(j==="0"){const m=await OBR.player.getMetadata();if(m&&m[KEY])await OBR.player.setMetadata({[KEY]:undefined});return}
    if(j!=="1")return;      // não sei (ou este navegador não divide o armazenamento com a janela da mesa): não mexo no que ela publicou
    let name="";try{name=await OBR.player.getName()}catch(e){}
    await OBR.player.setMetadata({[KEY]:await buildEntry(name)});
  }
  async function pubNpcs(force){            // só o mestre publica NPCs, e só os que ele mostrou
    if(!isGM)return;
    const sg=sigNpcs();if(!force&&sg===lastN)return;
    lastN=sg;
    const a=await buildNpcs();
    await OBR.player.setMetadata({[KEY_NPC]:a.length?a:undefined});
  }
  async function publish(force){
    if(busy){again=true;return}
    busy=true;
    try{await pubMine(force)}catch(e){console.warn("[mesa] não consegui publicar a ficha",e);last=""}
    try{await pubNpcs(force)}catch(e){console.warn("[mesa] não consegui publicar os NPCs",e);lastN=null}
    busy=false;if(again){again=false;publish()}
  }
  const soon=force=>{clearTimeout(timer);timer=setTimeout(()=>publish(force),force?0:500)};
  addEventListener("storage",()=>soon(false));            // a ficha (outra janela, mesmo domínio) salvou algo
  setInterval(()=>publish(false),3000);                   // garantia
  OBR.broadcast.onMessage("ordem.mesa/nudge",()=>soon(true));
  /* o mestre editou a minha ficha: só aceita se quem mandou for mesmo o mestre */
  OBR.broadcast.onMessage("ordem.mesa/edit",async ev=>{
    try{
      const d=ev.data||{};if(d.to!==OBR.player.id)return;
      const from=(await OBR.party.getPlayers()).find(p=>p.connectionId===ev.connectionId);
      if(!from||from.role!=="GM")return;
      const sheet=await unpack(d.z);JSON.parse(sheet);
      store.set(LS.sheet,sheet);soon(true);
    }catch(e){console.warn("[mesa] edição do mestre ignorada",e)}
  });
  publish(true);
  ensure();

  /* ===== Esconder: painel remoto (ligado pelo mestre) e descarte automático dos dados chamados ===== */
  amGM=isGM;myId=String(OBR.player.id||"");
  const LSCT="esc-ct";let timerD=0;
  async function readEsc(){
    let ps=[];try{ps=await OBR.party.getPlayers()}catch(e){}
    const me={id:OBR.player.id,role:isGM?"GM":"PLAYER",metadata:await OBR.player.getMetadata()};
    const gm=[me,...ps].find(p=>p.role==="GM"),g=normG(gm&&gm.metadata&&gm.metadata[K_G]);
    if(g.on!==escRemote){escRemote=g.on;cfg()}
    if(isGM)return;
    if(store.get(LSCT)==null)store.set(LSCT,String(g.ct));        // primeira leitura: não reaplica chamadas antigas
    if(g.ct>(+store.get(LSCT)||0)){
      store.set(LSCT,String(g.ct));
      if(g.ap&&g.calls.length)setTimeout(async()=>{                   // dá tempo de todo mundo ver o número revelado
        try{
          const m=await OBR.player.getMetadata(),pp=normP(m&&m[K_P]);
          const keep=pp.dice.filter(x=>!g.calls.includes(x.v));
          if(keep.length!==pp.dice.length)await OBR.player.setMetadata({[K_P]:{...pp,dice:keep,note:{k:"found",t:Date.now()}}});
        }catch(e){console.warn("[esconder] descarte falhou",e)}
      },6000);
    }
  }
  /* alguém me deu um dado de esconderijo (Distrair / Chamar atenção) */
  OBR.broadcast.onMessage("ordem.esc/give",async ev=>{
    try{
      const d=ev.data||{};if(String(d.to)!==myId||isGM)return;
      const m=await OBR.player.getMetadata(),pp=normP(m&&m[K_P]),f=+d.f,v=+d.v;
      if(!(f>=4&&f<=20&&v>=1&&v<=f))return;
      if(pp.dice.length>=8)return;
      await OBR.player.setMetadata({[K_P]:{...pp,h:1,dice:[...pp.dice,{f,v,n:String(d.n||"Presente").slice(0,24),id:Math.random().toString(36).slice(2,8)}]}});
    }catch(e){console.warn("[esconder] dado recebido falhou",e)}
  });
  try{OBR.party.onChange(()=>readEsc());OBR.player.onChange(()=>readEsc())}catch(e){}
  readEsc();setInterval(readEsc,5000);
})();
</script>
</body>
</html>
