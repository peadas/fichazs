<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Ficha Ordem (segundo plano)</title></head>
<body>
<script src="engine.js"></script>
<script type="module">
/* Fica rodando o tempo todo na sala e cuida de:
   1) dados: quando alguém rola, abre a camada transparente (overlay.html) onde os dados caem para todos;
   2) mesa: publica o resumo da ficha de quem entrou na mesa (e os NPCs que o mestre mostrou);
   3) recebe as edições que o mestre faz na ficha do jogador. */
import {loadOBR,ready} from "./obr.js";
import {KEY,KEY_NPC,LS,store,sig,buildEntry,sigNpcs,buildNpcs,unpack} from "./mesa-lib.js";
(async()=>{
  const OBR=await loadOBR();
  if(!OBR||!(await ready(OBR)))return;
  const abs=p=>new URL(p,location.href).href;

  /* ===== dados ===== */
  const CH=ENG.CH;
  let seq=0,open=false,mid="",lastAct=0,helloT=0,hello=false;
  const log=[];
  const feed=e=>OBR.broadcast.sendMessage(CH.feed,e,{destination:"LOCAL"}).catch(()=>{});
  async function openOverlay(e){
    const id="ordem.ficha/overlay/"+Date.now();
    open=true;hello=false;mid=id;lastAct=Date.now();
    try{
      await OBR.modal.open({id,url:abs("overlay.html")+"?mid="+encodeURIComponent(id)+"&s="+e.seq+"&p="+ENG.b64(e.p),
        fullScreen:true,hidePaper:true,hideBackdrop:true,disablePointerEvents:true});
    }catch(err){if(mid===id)open=false;console.warn("[ficha] não consegui abrir a camada de dados",err);return}
    /* se a camada não der sinal de vida em 6 s (não carregou), fecha e tenta de novo uma vez */
    clearTimeout(helloT);
    helloT=setTimeout(()=>{
      if(mid!==id||!open||hello)return;
      OBR.modal.close(id).catch(()=>{});open=false;
      if(!e.retry)openOverlay({...e,retry:1});
    },6000);
  }
  OBR.broadcast.onMessage(CH.roll,ev=>{
    const p=ENG.clean(ev.data);if(!p)return;
    if(open&&Date.now()-lastAct>45000)open=false;
    const e={seq:++seq,p};log.push(e);while(log.length>20)log.shift();
    lastAct=Date.now();
    if(open)feed(e);else openOverlay(e);
  });
  OBR.broadcast.onMessage(CH.idle,ev=>{
    const d=ev.data||{},seen=+d.seen||0;
    if(d.mid&&d.mid!==mid)return;                 // recado de uma camada antiga: não pode fechar a nova
    hello=true;clearTimeout(helloT);lastAct=Date.now();
    const missing=log.filter(e=>e.seq>seen);
    if(missing.length){missing.forEach(feed);return}
    if(d.idle&&open){open=false;OBR.modal.close(mid).catch(()=>{})}
  });

  /* ===== mesa: publicar a minha ficha na sala (só se eu entrei) ===== */
  let isGM=false;try{isGM=(await OBR.player.getRole())==="GM"}catch(e){}
  let last="",lastN=null,busy=false,again=false,timer=0;
  async function pubMine(force){
    const sg=sig();if(!force&&sg===last)return;
    last=sg;
    const j=store.get(LS.joined);
    if(j==="0"){const m=await OBR.player.getMetadata();if(m&&m[KEY])await OBR.player.setMetadata({[KEY]:undefined});return}
    if(j!=="1")return;      // não sei (ou este navegador não divide o armazenamento com a janela da mesa): não mexo no que ela publicou
    let name="";try{name=await OBR.player.getName()}catch(e){}
    await OBR.player.setMetadata({[KEY]:await buildEntry(name)});
  }
  async function pubNpcs(force){            // só o mestre publica NPCs, e só os que ele mostrou
    if(!isGM)return;
    const sg=sigNpcs();if(!force&&sg===lastN)return;
    lastN=sg;
    const a=await buildNpcs();
    await OBR.player.setMetadata({[KEY_NPC]:a.length?a:undefined});
  }
  async function publish(force){
    if(busy){again=true;return}
    busy=true;
    try{await pubMine(force)}catch(e){console.warn("[mesa] não consegui publicar a ficha",e);last=""}
    try{await pubNpcs(force)}catch(e){console.warn("[mesa] não consegui publicar os NPCs",e);lastN=null}
    busy=false;if(again){again=false;publish()}
  }
  const soon=force=>{clearTimeout(timer);timer=setTimeout(()=>publish(force),force?0:500)};
  addEventListener("storage",()=>soon(false));            // a ficha (outra janela, mesmo domínio) salvou algo
  setInterval(()=>publish(false),3000);                   // garantia
  OBR.broadcast.onMessage("ordem.mesa/nudge",()=>soon(true));
  /* o mestre editou a minha ficha: só aceita se quem mandou for mesmo o mestre */
  OBR.broadcast.onMessage("ordem.mesa/edit",async ev=>{
    try{
      const d=ev.data||{};if(d.to!==OBR.player.id)return;
      const from=(await OBR.party.getPlayers()).find(p=>p.connectionId===ev.connectionId);
      if(!from||from.role!=="GM")return;
      const sheet=await unpack(d.z);JSON.parse(sheet);
      store.set(LS.sheet,sheet);soon(true);
    }catch(e){console.warn("[mesa] edição do mestre ignorada",e)}
  });
  publish(true);
})();
</script>
</body>
</html>
