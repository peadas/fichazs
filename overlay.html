<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dados</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;600&family=Cinzel:wght@700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent;font:16px/1.4 Barlow,system-ui,sans-serif;color:#eef0ee}
#cv,#cv2{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#cv2[hidden]{display:none}
#chips{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 24px);pointer-events:none}
.chip{background:#0f1213ee;border:1px solid #8b9594;padding:10px 18px;text-align:center;max-width:min(92vw,560px);box-shadow:0 6px 20px #000a;animation:in .3s ease-out both;transition:opacity .5s,transform .5s}
.chip.out{opacity:0;transform:translateY(-8px)}
@keyframes in{from{opacity:0;transform:translateY(-10px)}}
.who{font:700 1rem "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.rows{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.rv small{display:block;color:#9aa4a3;font:600 .85rem "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.05em}
.rv strong{font:800 2.1rem/1.2 Cinzel,serif}
.rv.x{opacity:.45}.rv.x strong{text-decoration:line-through}
.rv.pv small,.rv.pv strong{color:#e9a23b}
.rv.rl small,.rv.rl strong{color:#e8d9b0}
.ok,.ok strong{color:#5fd38a}
.bad,.bad strong{color:#ff6b6b}
.crit{font:800 1.6rem Cinzel,serif;margin-top:2px}
.note{color:#9aa4a3;font-size:.9rem;margin-top:4px}
</style>
</head>
<body>
<canvas id="cv" aria-hidden="true"></canvas>
<canvas id="cv2" aria-hidden="true" hidden></canvas>
<div id="chips" aria-live="polite"></div>
<script src="engine.js"></script>
<script type="module">
import {loadOBR,ready} from "./obr.js";
const $=s=>document.querySelector(s);
const qs=new URLSearchParams(location.search),standalone=qs.has("standalone"),mid=qs.get("mid")||"";
const CH=ENG.CH,HOLD=5500,CHIP_LIFE=9000;
let OBR=null,received=0,idleTimer=0;
const queue=[];let cur=null,raf=0,raf2=0;

/* ---------- three.js: tenta 3 CDNs, uma de cada vez, e só começa a rolar quando decidiu ---------- */
const loadScript=u=>new Promise((ok,no)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=()=>{s.remove();no(new Error(u))};document.head.appendChild(s)});
async function loadThree(){
  for(const u of ["https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js","https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js","https://unpkg.com/three@0.128.0/build/three.min.js"]){
    if(window.THREE)return true;
    try{await Promise.race([loadScript(u),new Promise((_,no)=>setTimeout(()=>no(new Error("tempo")),7000))])}catch(e){console.warn("[ficha] three.js não carregou de",u)}
  }
  return !!window.THREE;
}
let threeOK=null,glFailed=false,ctxLost=false;
loadThree().then(v=>{threeOK=v;pump()});

/* ---------- 3D (mesmos dados e materiais da ficha) ---------- */
let R,scene,cam,M,shTex,gl=false,vw=0,vh=0;
function init3d(){
  const canvas=$("#cv");let r=null;
  for(const aa of [true,false]){           // sem antialias também serve (placas de vídeo fracas)
    try{r=new THREE.WebGLRenderer({canvas,alpha:true,antialias:aa});break}catch(e){r=null}
  }
  if(!r)throw new Error("sem WebGL");
  R=r;
  let soft=false;                          // renderização por software (aceleração de hardware desligada): mais leve
  try{const g=R.getContext(),x=g.getExtension("WEBGL_debug_renderer_info");if(x)soft=/swiftshader|llvmpipe|software|basic render/i.test(String(g.getParameter(x.UNMASKED_RENDERER_WEBGL)))}catch(e){}
  R.setPixelRatio(soft?1:Math.min(2,devicePixelRatio||1));R.setClearColor(0x000000,0);
  canvas.addEventListener("webglcontextlost",e=>{e.preventDefault();ctxLost=true});
  scene=new THREE.Scene();cam=new THREE.PerspectiveCamera(35,1,50,30000);
  M={gold:new THREE.MeshStandardMaterial({color:0xd0a93f,metalness:.45,roughness:.3}),ena:new THREE.MeshStandardMaterial({color:0x08080a,metalness:.1,roughness:.25}),
    pv:new THREE.MeshPhysicalMaterial({color:0x14171c,metalness:.35,roughness:.25,clearcoat:1,clearcoatRoughness:.15}),
    rel:new THREE.MeshPhysicalMaterial({color:0xe9e3d3,metalness:.1,roughness:.3,clearcoat:.8})};
  scene.add(new THREE.AmbientLight(0xffffff,.85));
  const l2=new THREE.DirectionalLight(0xffe8b0,.6);l2.position.set(400,500,300);scene.add(l2);
  const l=new THREE.DirectionalLight(0xffffff,.9);l.position.set(-300,800,-400);scene.add(l);
  const c=document.createElement("canvas");c.width=c.height=64;const x=c.getContext("2d"),gr=x.createRadialGradient(32,32,6,32,32,32);
  gr.addColorStop(0,"rgba(0,0,0,.9)");gr.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=gr;x.fillRect(0,0,64,64);shTex=new THREE.CanvasTexture(c);
  setView();gl=true;
}
/* câmera de cima; a arena é sempre a mesma, a tela só muda o zoom. Se a janela ainda não tem tamanho, tenta de novo depois */
function setView(){
  const w=innerWidth||document.documentElement.clientWidth,h=innerHeight||document.documentElement.clientHeight;
  if(!(w>1&&h>1))return false;
  vw=w;vh=h;
  const k=Math.min(w/ENG.VIEW.w,h/ENG.VIEW.h);
  R.setSize(w,h,false);cam.aspect=w/h;
  const H=(h/k/2)/Math.tan(cam.fov*Math.PI/360);
  cam.position.set(0,H,0);cam.up.set(0,0,-1);cam.lookAt(0,0,0);cam.updateProjectionMatrix();
  return true;
}
addEventListener("resize",()=>{if(gl&&setView())R.render(scene,cam)});
const texC={};
function numMat(n,pv){
  const key=n+(pv||"");
  if(!texC[key]){
    const c=document.createElement("canvas");c.width=c.height=128;
    const x=c.getContext("2d");x.textAlign="center";x.textBaseline="middle";
    x.font=`italic 700 ${n>9?66:88}px Georgia,serif`;
    if(!pv){x.lineWidth=4;x.strokeStyle="#6b4e12";x.strokeText(n,64,70)}
    x.fillStyle=({pv:"#e9a23b",rel:"#8c2f3a"})[pv]||"#ecc962";x.fillText(n,64,70);
    if(n===6||n===9){x.fillRect(40,112,48,7)}
    texC[key]=new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,alphaTest:.04});
  }
  return texC[key];
}
const mk=pos=>{const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));g.computeVertexNormals();return g};
/* kind: "" (dourado) | "pv" (pavor) | "rel" (relação). Face i = número i+1. d4: o número fica nos cantos */
function makeDie(f,kind){
  const a=ENG.analyze(f),grp=new THREE.Group(),all=[],z=new THREE.Vector3(0,0,1);
  a.Fs.forEach((F,i)=>{
    const pos=[];
    F.t.forEach(t=>t.forEach(v=>{all.push(v.x,v.y,v.z);const w=v.clone().sub(F.c).multiplyScalar(.8).add(F.c).addScaledVector(F.n,.012);pos.push(w.x,w.y,w.z)}));
    if(!kind)grp.add(new THREE.Mesh(mk(pos),M.ena));
    const q=new THREE.Quaternion().setFromUnitVectors(z,F.n);
    if(f===4){
      const xv=new THREE.Vector3(1,0,0).applyQuaternion(q),yv=new THREE.Vector3(0,1,0).applyQuaternion(q);
      F.vi.forEach(vi=>{
        const t=a.V[vi].clone().sub(F.c).normalize(),an=Math.atan2(-t.dot(xv),t.dot(yv));
        const pl=new THREE.Mesh(new THREE.PlaneGeometry(.6,.6),numMat(vi+1,kind));
        pl.position.copy(F.c).addScaledVector(t,F.R*.52).addScaledVector(F.n,.025);
        pl.quaternion.setFromAxisAngle(F.n,an).multiply(q);grp.add(pl);
      });
    }else{
      const s=F.R*1.15,pl=new THREE.Mesh(new THREE.PlaneGeometry(s,s),numMat(i+1,kind));
      pl.position.copy(F.c).addScaledVector(F.n,.025);pl.quaternion.copy(q);grp.add(pl);
    }
  });
  grp.add(new THREE.Mesh(mk(all),M[kind||"gold"]));
  grp.userData.s=ENG.RAD/a.mx;grp.scale.setScalar(grp.userData.s);
  /* os dados ficam sempre no meio da arena, perto da câmera: nunca "somem" por corte de visão */
  grp.traverse(o=>{o.frustumCulled=false});
  return grp;
}
function disposeGroup(c){
  c.meshes.forEach(m=>{scene.remove(m);if(m.userData.sh){scene.remove(m.userData.sh);m.userData.sh.material.dispose();m.userData.sh.geometry.dispose()}
    m.traverse(o=>{if(o.isMesh&&o.geometry)o.geometry.dispose()})});
  c.meshes=[];
}

/* ---------- reserva sem WebGL (aceleração de hardware desligada): dados desenhados em 2D ---------- */
const SIDES={4:3,6:4,8:4,10:5,12:5,20:6};
const KS={"":{f:"#0b0b0e",s:"#d0a93f",t:"#ecc962"},pv:{f:"#14171c",s:"#e9a23b",t:"#e9a23b"},rel:{f:"#e9e3d3",s:"#8c2f3a",t:"#8c2f3a"}};
function play2d(p){
  const cv=$("#cv2"),w=Math.max(2,innerWidth||800),h=Math.max(2,innerHeight||600),dpr=Math.min(2,devicePixelRatio||1);
  cv.hidden=false;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  const x=cv.getContext("2d");
  if(!x){cur=null;showChip(p);pump();return}
  const n=p.list.length,rad=Math.max(20,Math.min(44,w/(n*2.6+1),h/7)),floor=h*.5+rad*.7;
  const rnd=ENG.mulberry32(p.seed||1);
  const ds=p.list.map(([nm,f],i)=>({f,k:KS[p.kinds[i]]||KS[""],res:p.res[i],x:w/2+(i-(n-1)/2)*rad*2.5+(rnd()-.5)*rad,y:-rad*(1+i*.8),
    vx:(rnd()-.5)*110,vy:0,a:rnd()*6.283,w:(rnd()<.5?-1:1)*(9+rnd()*9),stop:1300+i*160+rnd()*350,n:1+Math.floor(rnd()*f),tn:0,done:false}));
  const lastStop=Math.max(...ds.map(d=>d.stop));
  cur={p,mode:"2d"};
  const T0=performance.now();let last=T0,phase="roll",t1=0,al=1;
  const poly=d=>{const S=SIDES[d.f],off=d.f===6?Math.PI/4:-Math.PI/2;x.beginPath();for(let i=0;i<S;i++){const q=off+i*2*Math.PI/S,px=Math.cos(q)*rad,py=Math.sin(q)*rad;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath()};
  const frame=now=>{
    raf2=0;
    const dt=Math.min(.05,Math.max(0,(now-last)/1000)),t=now-T0;last=now;
    x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);x.globalAlpha=al;
    for(const d of ds){
      if(!d.done){
        d.vy+=2600*dt;d.y+=d.vy*dt;d.x+=d.vx*dt;d.a+=d.w*dt;d.w*=Math.pow(.4,dt);d.vx*=Math.pow(.3,dt);
        if(d.x<rad){d.x=rad;d.vx=Math.abs(d.vx)}if(d.x>w-rad){d.x=w-rad;d.vx=-Math.abs(d.vx)}
        if(d.y>floor){d.y=floor;d.vy=Math.abs(d.vy)<140?0:-d.vy*.45;d.w*=.85}
        if(now-d.tn>85){d.n=1+Math.floor(Math.random()*d.f);d.tn=now}
        if(t>=d.stop){d.done=true;d.n=d.res;d.vy=0;d.y=floor}
      }else{d.a+=(Math.round(d.a/6.2832)*6.2832-d.a)*Math.min(1,dt*9)}
      x.fillStyle="rgba(0,0,0,.35)";x.beginPath();x.ellipse(d.x,floor+rad*.85,rad*.9,rad*.2,0,0,7);x.fill();
      x.save();x.translate(d.x,d.y);x.rotate(d.a);poly(d);x.fillStyle=d.k.f;x.fill();x.lineWidth=3;x.strokeStyle=d.k.s;x.lineJoin="round";x.stroke();
      x.fillStyle=d.k.t;x.textAlign="center";x.textBaseline="middle";x.font=`italic 700 ${Math.round(rad*(d.n>9?.85:1.1))}px Georgia,serif`;x.fillText(d.n,0,rad*.05);x.restore();
    }
    x.globalAlpha=1;
    if(phase==="roll"&&t>lastStop+350){phase="hold";t1=now;showChip(p)}
    else if(phase==="hold"&&now-t1>=(queue.length?1300:HOLD)){phase="out";t1=now}
    else if(phase==="out"){al=Math.max(0,1-(now-t1)/300);if(al<=0){x.clearRect(0,0,w,h);cv.hidden=true;cur=null;pump();return}}
    raf2=requestAnimationFrame(frame);
  };
  raf2=requestAnimationFrame(frame);
}

/* ---------- resultado na tela ---------- */
const chips=$("#chips");
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
function showChip(p){
  const c=el("div","chip"),w=el("div","who",p.who+(p.title?" · "+p.title:""));w.style.color=p.color;c.append(w);
  const rows=el("div","rows");
  p.rows.forEach(r=>{const rv=el("div","rv "+r.c);rv.append(el("small",null,r.l),el("strong",null,r.v));rows.append(rv)});
  c.append(rows);
  if(p.crit)c.append(el("div","crit "+p.crit.c,p.crit.t));
  if(p.note)c.append(el("div","note",p.note));
  chips.append(c);
  while(chips.children.length>4)chips.firstChild.remove();
  setTimeout(()=>{c.classList.add("out");setTimeout(()=>{c.remove();maybeIdle()},520)},CHIP_LIFE);
  if(OBR&&p.text){try{OBR.notification.show(p.text)}catch(e){}}
}

/* ---------- fila de rolagens ---------- */
function enqueue(raw,seq){
  if(seq&&seq<=received)return;
  if(seq)received=seq;
  clearTimeout(idleTimer);
  const p=ENG.clean(raw);if(!p)return maybeIdle();
  queue.push(p);pump();
}
function pump(){
  if(cur)return;
  if(threeOK===null)return;                 // ainda decidindo se o three.js carregou
  const p=queue.shift();if(!p)return maybeIdle();
  if(!p.anim){showChip(p);return pump()}
  if(threeOK&&!glFailed){
    const meshes=[];
    try{
      if(!gl)init3d();
      setView();
      const sim=new ENG.Sim(p.list,p.seed);
      p.list.forEach(([n,f],i)=>{
        const m=makeDie(f,p.kinds[i]);
        const sh=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:shTex,transparent:true,depthWrite:false}));
        sh.frustumCulled=false;sh.rotation.x=-Math.PI/2;m.userData.sh=sh;scene.add(m,sh);meshes.push(m);
      });
      cur={p,sim,meshes,phase:"roll",acc:0,last:performance.now(),t0:0};
      sync(cur);
    }catch(e){
      console.warn("[ficha] 3D indisponível, usando os dados em 2D",e);
      glFailed=true;disposeGroup({meshes});cur=null;
    }
    if(cur){if(!raf)raf=requestAnimationFrame(loop);return}
  }
  play2d(p);
}
function sync(c){
  c.sim.bodies.forEach((b,i)=>{
    const m=c.meshes[i],sh=m.userData.sh,hh=Math.max(0,b.p[1]-b.rad*.6);
    m.position.set(b.p[0],b.p[1],b.p[2]);m.quaternion.set(b.q[0],b.q[1],b.q[2],b.q[3]);
    sh.position.set(b.p[0],.5,b.p[2]);sh.scale.setScalar(b.rad*(3+hh/150));sh.material.opacity=Math.max(.15,.75-hh/450);
  });
}
function loop(now){
  raf=0;
  const c=cur;
  if(!c||c.mode==="2d"){return}
  try{
    if(ctxLost)throw new Error("o navegador perdeu o contexto do WebGL");
    if(innerWidth!==vw||innerHeight!==vh)setView();        // a janela pode ganhar tamanho depois de abrir
    const dt=Math.min(.1,Math.max(0,(now-c.last)/1000));c.last=now;
    if(c.phase==="roll"){
      c.acc+=dt;let n=0;
      while(c.acc>=ENG.DT&&!c.sim.finished&&n++<40){c.sim.stepOnce();c.acc-=ENG.DT}
      sync(c);
      if(c.sim.finished){
        /* se este computador deu um resultado diferente do oficial (raríssimo), gira o dado até a face certa */
        c.fix=[];
        c.sim.bodies.forEach((b,i)=>{
          const want=c.p.res[i];
          if(c.sim.results[i][2]!==want){
            const from=c.meshes[i].quaternion.clone(),t=ENG.PH.targetQuat(b,want-1,b.f===4);
            c.fix.push({i,from,to:new THREE.Quaternion(t[0],t[1],t[2],t[3])});
          }
        });
        c.phase="snap";c.t0=now;
      }
    }
    if(c.phase==="snap"){
      const k=Math.min(1,(now-c.t0)/300);
      c.fix.forEach(f=>{c.meshes[f.i].quaternion.copy(f.from).slerp(f.to,k)});
      if(k>=1){c.phase="hold";c.t0=now;showChip(c.p)}
    }else if(c.phase==="hold"){
      if(now-c.t0>=(queue.length?1300:HOLD)){c.phase="out";c.t0=now}
    }else if(c.phase==="out"){
      const k=Math.min(1,(now-c.t0)/300);
      c.meshes.forEach(m=>{m.scale.setScalar(m.userData.s*(1-k));m.userData.sh.material.opacity*=(1-k)});
      if(k>=1){disposeGroup(c);cur=null;R.render(scene,cam);pump();return}
    }
    R.render(scene,cam);
  }catch(e){
    console.warn("[ficha] erro na animação 3D",e);
    glFailed=true;
    const p=c.p,ph=c.phase;disposeGroup(c);cur=null;
    if(ph==="roll"||ph==="snap")play2d(p);else pump();
    return;
  }
  raf=requestAnimationFrame(loop);
}

/* ---------- encerramento ---------- */
function maybeIdle(){
  if(cur||queue.length||chips.children.length)return;
  if(standalone){parent.postMessage({ordem:"overlay-done"},"*");return}
  if(!OBR)return;
  OBR.broadcast.sendMessage(CH.idle,{seen:received,idle:true,mid},{destination:"LOCAL"}).catch(()=>{});
  clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{if(mid)OBR.modal.close(mid).catch(()=>{})},12000);   // garantia: fecha sozinha
}

/* ---------- início ---------- */
(async()=>{
  const s0=+qs.get("s")||0;
  if(standalone){
    try{enqueue(ENG.unb64(qs.get("p")),s0||1)}catch(e){parent.postMessage({ordem:"overlay-done"},"*")}
    return;
  }
  OBR=await loadOBR();
  if(!OBR||!(await ready(OBR)))OBR=null;
  if(OBR){
    OBR.broadcast.onMessage(CH.feed,ev=>{const d=ev.data||{};enqueue(d.p,+d.seq||0)});
    OBR.broadcast.sendMessage(CH.idle,{seen:s0,idle:false,mid},{destination:"LOCAL"}).catch(()=>{});
  }
  try{enqueue(ENG.unb64(qs.get("p")),s0)}catch(e){maybeIdle()}
})();
</script>
</body>
</html>
